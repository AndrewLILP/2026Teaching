<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MA4-ARE-C-01 — Topic Review Notebook | Area</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&family=Caveat:wght@600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --outer:#C8BFB0;
    --paper:#F7F4EE;
    --paper-dark:#EDE8DF;
    --text:#1E2A35;
    --slate:#3D5A80;
    --forest:#4A7C59;
    --amber:#E89C2F;
    --terracotta:#C1614F;
    --correct:#4A7C59;
    --wrong:#C1614F;
    --font-head:'Nunito',sans-serif;
    --font-body:'Nunito Sans',sans-serif;
    --font-hand:'Caveat',cursive;
    --p1-accent:#2F5E3F;
    --p2-accent:#3D7A4A;
    --p3-accent:#5C6B2F;
    --p4-accent:#2E6B66;
  }
  *{box-sizing:border-box;}
  body.font-system{--font-body:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  body.font-atkinson{--font-body:'Atkinson Hyperlegible',sans-serif;}

  body{
    margin:0;
    background:var(--outer);
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;font-size:0.9em;line-height:1.2;}
  .frac .num{border-bottom:1.5px solid currentColor;padding:0 3px 1px;text-align:center;}
  .frac .den{padding:1px 3px 0;text-align:center;}

  /* Header */
  header.top{
    background:var(--slate);
    color:#FFFFFF;
    padding:20px 20px 18px;
  }
  header.top .inner{max-width:1040px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;}
  a.back-link{
    display:inline-block;
    font-family:var(--font-head);
    font-weight:700;
    font-size:13px;
    color:#FFFFFF;
    text-decoration:none;
    background:rgba(255,255,255,0.15);
    padding:6px 12px;
    border-radius:999px;
    margin-bottom:10px;
  }
  a.back-link:hover{background:rgba(255,255,255,0.28);}
  a.back-link:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px;}
  .outcome-badge{
    display:inline-block;
    font-family:var(--font-head);
    font-weight:800;
    font-size:12px;
    letter-spacing:0.04em;
    background:rgba(255,255,255,0.18);
    padding:4px 10px;
    border-radius:999px;
    margin:0 0 8px 8px;
  }
  header.top h1{font-family:var(--font-head);font-weight:800;font-size:24px;margin:0 0 4px;}
  header.top p.desc{margin:0;font-size:14px;max-width:640px;color:rgba(255,255,255,0.92);}

  .font-toggle{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  .font-toggle-label{font-family:var(--font-head);font-size:11px;font-weight:700;color:rgba(255,255,255,0.85);text-transform:uppercase;letter-spacing:0.04em;}
  .font-toggle-btns{display:flex;gap:4px;background:rgba(255,255,255,0.12);border-radius:999px;padding:3px;}
  .font-toggle-btns button{font-family:'Nunito Sans',sans-serif;font-size:12px;font-weight:700;border:none;background:transparent;color:#FFFFFF;padding:6px 12px;border-radius:999px;cursor:pointer;}
  .font-toggle-btns button.active{background:#FFFFFF;color:var(--slate);}
  .font-toggle-btns button:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px;}

  /* Page (unit/chapter) tab nav */
  nav.page-nav{
    max-width:1040px;
    margin:18px auto 0;
    padding:0 20px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  nav.page-nav button{
    font-family:var(--font-head);
    font-weight:800;
    font-size:13px;
    border:none;
    cursor:pointer;
    padding:10px 16px 8px;
    border-radius:8px 8px 0 0;
    background:var(--paper-dark);
    color:var(--text);
    opacity:0.7;
  }
  nav.page-nav button.active{
    background:var(--paper);
    opacity:1;
    box-shadow:0 -2px 0 var(--page-accent, var(--slate)) inset;
  }
  nav.page-nav button:focus-visible{outline:2px solid var(--slate);outline-offset:2px;}

  /* Notebook body */
  .notebook-wrap{max-width:1040px;margin:0 auto 64px;padding:0 20px;}
  .notebook{
    background:var(--paper);
    border-radius:0 8px 8px 8px;
    position:relative;
    padding:28px 28px 28px 56px;
    background-image:repeating-linear-gradient(var(--paper) 0px, var(--paper) 31px, #E2DACB 32px);
    box-shadow:0 6px 18px rgba(0,0,0,0.12);
  }
  .spiral{
    position:absolute;
    left:0;top:0;bottom:0;
    width:34px;
    background:var(--paper-dark);
    border-radius:0 0 0 8px;
  }
  .spiral::before{
    content:'';
    position:absolute;
    left:14px;top:14px;bottom:14px;
    width:6px;
    background-image:radial-gradient(circle, #B7AD9C 3px, transparent 3.5px);
    background-size:100% 22px;
    background-repeat:repeat-y;
  }

  .page-section{display:none;}
  .page-section.active{display:block;}

  .page-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .page-title-row h2{font-family:var(--font-head);font-weight:800;font-size:20px;margin:0;color:var(--page-accent, var(--slate));}
  .page-meta{font-size:13px;color:#5A6672;margin:0 0 18px;}

  /* Tier tabs */
  .tier-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .tier-tab{
    font-family:var(--font-head);
    font-weight:800;
    font-size:13px;
    border:2px solid var(--page-accent, var(--slate));
    background:transparent;
    color:var(--page-accent, var(--slate));
    padding:7px 16px;
    border-radius:999px;
    cursor:pointer;
  }
  .tier-tab.active{background:var(--page-accent, var(--slate));color:#FFFFFF;}
  .tier-tab:focus-visible{outline:2px solid var(--text);outline-offset:2px;}

  .tier-panel{display:none;}
  .tier-panel.active{display:block;}

  .q-block{
    background:#FFFFFF;
    border:1px solid #E4DCD0;
    border-left:5px solid var(--page-accent, var(--slate));
    border-radius:6px;
    padding:14px 16px;
    margin-bottom:14px;
  }
  .q-num{font-family:var(--font-head);font-weight:800;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;color:var(--page-accent, var(--slate));margin-bottom:4px;}
  .q-text{font-size:15px;margin:0 0 12px;}

  .mcq-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;}
  .mcq-btn{
    text-align:left;
    font-family:var(--font-body);
    font-size:14px;
    border:1.5px solid #D8CFC0;
    background:var(--paper);
    color:var(--text);
    padding:9px 12px;
    border-radius:6px;
    cursor:pointer;
  }
  .mcq-btn:hover{border-color:var(--page-accent, var(--slate));}
  .mcq-btn:focus-visible{outline:2px solid var(--page-accent, var(--slate));outline-offset:2px;}
  .mcq-btn.correct-pick{background:var(--correct);border-color:var(--correct);color:#FFFFFF;}
  .mcq-btn.wrong-pick{background:#FBEAE6;border-color:var(--wrong);color:var(--text);}
  .mcq-btn.locked{cursor:default;opacity:0.9;}
  .mcq-btn.dim{opacity:0.55;}

  .mcq-feedback{display:none;margin-top:10px;padding:8px 12px;border-radius:6px;font-size:13.5px;}
  .mcq-feedback.show{display:block;}
  .mcq-feedback.correct{background:#E9F2EB;color:#2F5E3F;border:1px solid var(--correct);}
  .mcq-feedback.wrong{background:#FBEAE6;color:#7A3B30;border:1px solid var(--wrong);}

  .typein-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .typein-row input[type="text"]{
    font-family:var(--font-body);
    font-size:14px;
    padding:8px 10px;
    border:1.5px solid #D8CFC0;
    border-radius:6px;
    width:160px;
  }
  .typein-row input:disabled{background:#E9F2EB;border-color:var(--correct);}
  .btn-check{
    font-family:var(--font-head);
    font-weight:800;
    font-size:13px;
    border:none;
    background:var(--page-accent, var(--slate));
    color:#FFFFFF;
    padding:9px 16px;
    border-radius:6px;
    cursor:pointer;
  }
  .btn-check:focus-visible{outline:2px solid var(--text);outline-offset:2px;}
  .unit-label{font-size:13px;color:#5A6672;}

  /* Error Detective */
  .ed-steps{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .ed-step{
    text-align:left;
    font-family:var(--font-body);
    font-size:14px;
    border:1.5px solid #D8CFC0;
    background:var(--paper);
    color:var(--text);
    padding:10px 12px;
    border-radius:6px;
    cursor:pointer;
  }
  .ed-step:hover{border-color:var(--page-accent, var(--slate));}
  .ed-step.correct-pick{background:var(--correct);border-color:var(--correct);color:#FFFFFF;}
  .ed-step.wrong-pick{background:#FBEAE6;border-color:var(--wrong);}
  .ed-step.locked{cursor:default;}

  .closer-badge{
    display:inline-block;
    font-family:var(--font-head);
    font-weight:800;
    font-size:10px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    background:var(--amber);
    color:#3D2C0E;
    padding:3px 9px;
    border-radius:999px;
    margin-bottom:8px;
  }

  /* Confidence */
  .confidence-block{
    margin-top:24px;
    padding:18px 20px;
    background:var(--paper-dark);
    border-radius:8px;
    text-align:center;
  }
  .confidence-block p{font-family:var(--font-head);font-weight:800;font-size:14px;margin:0 0 10px;}
  .confidence-btns{display:flex;justify-content:center;gap:14px;}
  .confidence-btns button{
    font-size:28px;
    background:#FFFFFF;
    border:2px solid transparent;
    border-radius:999px;
    width:56px;height:56px;
    cursor:pointer;
  }
  .confidence-btns button.selected{border-color:var(--page-accent, var(--slate));}
  .confidence-btns button:focus-visible{outline:2px solid var(--text);outline-offset:2px;}
  .confidence-note{font-size:12px;color:#5A6672;margin-top:8px;}

  .q-diagram-wrap{margin-bottom:10px;}
  .q-diagram{display:block;color:var(--page-accent, var(--slate));max-width:100%;height:auto;}
  .q-table{border-collapse:collapse;margin:8px 0;}
  .q-table th,.q-table td{border:1px solid var(--page-accent, var(--slate));padding:5px 12px;text-align:center;font-family:var(--font-head);font-size:14px;}
  .q-table th{background:var(--paper-dark);font-weight:800;}

  @media (max-width:600px){
    header.top .inner{flex-direction:column;}
    .font-toggle{align-items:flex-start;}
    .notebook{padding:24px 18px 24px 44px;}
    .spiral{width:26px;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="inner">
    <div>
      <a class="back-link" href="index.html">&larr; Back to Hub</a>
      <span class="outcome-badge">MA4-ARE-C-01</span>
      <h1>Topic Review Notebook — Area</h1>
      <p class="desc">Foundation, Core and Extension retrieval practice across all four sub-topics in this unit.</p>
    </div>
    <div class="font-toggle">
      <span class="font-toggle-label">Font</span>
      <div class="font-toggle-btns" role="group" aria-label="Choose a reading font">
        <button type="button" class="active" data-font="default" onclick="setFont('default', this)" aria-label="Use Nunito Sans font">Nunito Sans</button>
        <button type="button" data-font="system" onclick="setFont('system', this)" aria-label="Use system default font">System</button>
        <button type="button" data-font="atkinson" onclick="setFont('atkinson', this)" aria-label="Use Atkinson Hyperlegible font">Atkinson</button>
      </div>
    </div>
  </div>
</header>

<nav class="page-nav" id="pageNav" aria-label="Choose a sub-topic page"></nav>

<div class="notebook-wrap">
  <div class="notebook">
    <div class="spiral" aria-hidden="true"></div>
    <div id="pagesContainer"></div>
  </div>
</div>

<script>
const PAGE_DATA = [{"id": 1, "slug": "rectangles-triangles-parallelograms", "title": "Area of rectangles, triangles and parallelograms", "accent": "#2F5E3F", "foundation": [{"type": "mc", "q": "Find the area of a rectangle 8 m long and 5 m wide.", "opts": [{"t": "13 m²", "c": false, "m": "That adds the length and width instead of multiplying them."}, {"t": "40 m²", "c": true, "m": "Correct! Area of a rectangle = length &times; width = 8 &times; 5."}, {"t": "26 m²", "c": false, "m": "That doubles the sum of the sides — that finds perimeter, not area."}, {"t": "20 m²", "c": false, "m": "Check your multiplication of 8 and 5 again."}], "dg": {"shape": "rect", "w": 8, "h": 5, "unit": "m"}}, {"type": "mc", "q": "A triangle has base 10 cm and height 6 cm. Find its area.", "opts": [{"t": "60 cm²", "c": false, "m": "That's base &times; height — remember a triangle is half of that rectangle."}, {"t": "16 cm²", "c": false, "m": "That adds base and height instead of using the area formula."}, {"t": "30 cm²", "c": true, "m": "Correct! Area of a triangle = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span> &times; base &times; height = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span> &times; 10 &times; 6."}, {"t": "120 cm²", "c": false, "m": "That doubles base &times; height instead of halving it."}], "dg": {"shape": "triangle", "base": 10, "height": 6, "unit": "cm"}}, {"type": "mc", "q": "Which formula finds the area of a parallelogram?", "opts": [{"t": "A = l &times; w", "c": false, "m": "That's the rectangle formula — a parallelogram uses base and perpendicular height."}, {"t": "A = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span> &times; b &times; h", "c": false, "m": "That's the triangle formula — a parallelogram doesn't get halved."}, {"t": "A = 2(l + w)", "c": false, "m": "That finds perimeter, not area."}, {"t": "A = b &times; h", "c": true, "m": "Correct! A parallelogram's area is base &times; perpendicular height."}], "dg": {"shape": "generic_parallelogram"}}, {"type": "mc", "q": "A rectangle has length 9 m and width 3 m. What is its area?", "opts": [{"t": "27 m²", "c": true, "m": "Correct! Area of a rectangle = length &times; width = 9 &times; 3."}, {"t": "24 m²", "c": false, "m": "That's the perimeter (2 &times; (9+3)), not the area."}, {"t": "12 m²", "c": false, "m": "That adds the length and width instead of multiplying."}, {"t": "6 m²", "c": false, "m": "Check your multiplication of 9 and 3 again."}], "dg": {"shape": "rect", "w": 9, "h": 3, "unit": "m"}}, {"type": "mc", "q": "A composite shape is a rectangle 6 cm &times; 4 cm with a right-angled triangle (base 6 cm, height 3 cm) attached to one side. Find the total area.", "opts": [{"t": "27 cm²", "c": false, "m": "Check the triangle part — it should be <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span> &times; 6 &times; 3 = 9, added to the rectangle's 24."}, {"t": "33 cm²", "c": true, "m": "Correct! Rectangle = 6 &times; 4 = 24 cm&sup2;, triangle = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span> &times; 6 &times; 3 = 9 cm&sup2;, total = 33 cm&sup2;."}, {"t": "42 cm²", "c": false, "m": "That treats the triangle as base &times; height instead of halving it."}, {"t": "30 cm²", "c": false, "m": "Check both parts — rectangle is 24 cm&sup2; and the triangle adds 9 cm&sup2;, not 6 cm&sup2;."}], "dg": {"shape": "composite_rect_triangle", "rw": 6, "rh": 4, "tb": 6, "th": 3, "unit": "cm"}}, {"type": "mc", "q": "What is the correct unit for measuring area?", "opts": [{"t": "cm", "c": false, "m": "That's a unit of length, not area."}, {"t": "cm³", "c": false, "m": "That's a unit of volume — area uses squared units."}, {"t": "m", "c": false, "m": "That's a unit of length, not area."}, {"t": "cm²", "c": true, "m": "Correct! Area is measured in squared units."}], "dg": {"shape": "unit_square"}}, {"type": "mc", "q": function setFont(kind, btn){
  document.body.classList.remove('font-system','font-atkinson');
  if(kind==='system') document.body.classList.add('font-system');
  if(kind==='atkinson') document.body.classList.add('font-atkinson');
  document.querySelectorAll('.font-toggle-btns button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

}

// ---- Simple schematic diagrams (fixed proportions, not to scale) ----
function fmt(v, unit){ return (v==='?' || v===null || v===undefined) ? '?' : (v + ' ' + unit); }

function diagramSvg(spec){
  const RHOMBUS_FAMILY = ['rhombus','kite','generic_kite'];
  const isRhombusFamily = RHOMBUS_FAMILY.includes(spec.shape);
  const W = isRhombusFamily ? 210 : 176;
  const H = isRhombusFamily ? 140 : 118;
  let inner = '';

  function label(x,y,text,anchor){
    return `<text x="${x}" y="${y}" font-size="11" text-anchor="${anchor||'middle'}" fill="currentColor">${text}</text>`;
  }
  function dashedLine(x1,y1,x2,y2){
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4,3"/>`;
  }

  switch(spec.shape){
    case 'rect': {
      const x=48,y=26,w=100,h=54;
      inner = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="currentColor" stroke-width="2"/>`
        + label(x+w/2, y-8, fmt(spec.w, spec.unit))
        + label(x-10, y+h/2+4, fmt(spec.h, spec.unit), 'end');
      break;
    }
    case 'triangle': {
      const x1=50,y1=90,x2=150,y2=90,x3=50,y3=24;
      inner = `<polygon points="${x1},${y1} ${x2},${y2} ${x3},${y3}" fill="none" stroke="currentColor" stroke-width="2"/>`
        + dashedLine(x3,y3,x1,y1)
        + label((x1+x2)/2, y1+16, fmt(spec.base, spec.unit))
        + label(x1-10, (y1+y3)/2, fmt(spec.height, spec.unit), 'end');
      break;
    }
    case 'generic_parallelogram':
    case 'parallelogram': {
      const bx=40, by=90, tx=64, ty=26, w=90;
      const p = `${bx},${by} ${bx+w},${by} ${tx+w},${ty} ${tx},${ty}`;
      inner = `<polygon points="${p}" fill="none" stroke="currentColor" stroke-width="2"/>`
        + dashedLine(tx,ty,tx,by)
        + label(bx+w/2, by+16, (spec.shape==='generic_parallelogram' ? 'base = b' : fmt(spec.base, spec.unit)))
        + label(tx-18, (ty+by)/2, (spec.shape==='generic_parallelogram' ? 'h' : fmt(spec.height, spec.unit)), 'end');
      break;
    }
    case 'circle':
    case 'generic_circle': {
      const cx=88, cy=58, r=42;
      inner = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="currentColor" stroke-width="2"/>`;
      if(spec.shape==='generic_circle'){
        inner += `<line x1="${cx}" y1="${cy}" x2="${cx+r}" y2="${cy}" stroke="currentColor" stroke-width="1.5"/>` + label(cx+r/2, cy-6, 'r');
      } else if(spec.d !== undefined){
        inner += `<line x1="${cx-r}" y1="${cy}" x2="${cx+r}" y2="${cy}" stroke="currentColor" stroke-width="1.5"/>` + label(cx, cy-8, 'd = '+fmt(spec.d, spec.unit));
      } else {
        inner += `<line x1="${cx}" y1="${cy}" x2="${cx+r}" y2="${cy}" stroke="currentColor" stroke-width="1.5"/>` + label(cx+r/2, cy-6, 'r = '+fmt(spec.r, spec.unit));
      }
      break;
    }
    case 'semicircle': {
      const cx=88, cy=88, r=42;
      inner = `<path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy} Z" fill="none" stroke="currentColor" stroke-width="2"/>`
        + `<line x1="${cx}" y1="${cy}" x2="${cx+r}" y2="${cy}" stroke="currentColor" stroke-width="1.5"/>`
        + label(cx+r/2, cy-6, 'r = '+fmt(spec.r, spec.unit));
      break;
    }
    case 'quadrant': {
      const cx=40, cy=98, r=60;
      inner = `<path d="M ${cx} ${cy-r} A ${r} ${r} 0 0 1 ${cx+r} ${cy} L ${cx} ${cy} Z" fill="none" stroke="currentColor" stroke-width="2"/>`
        + `<line x1="${cx}" y1="${cy}" x2="${cx+r*0.7}" y2="${cy-r*0.71}" stroke="currentColor" stroke-width="1.5"/>`
        + label(cx+r*0.42, cy-r*0.5, 'r = '+fmt(spec.r, spec.unit));
      break;
    }
    case 'sector': {
      const cx=88, cy=68, r=44, ang=(spec.angle||90)*Math.PI/180;
      const x2 = cx + r*Math.cos(-Math.PI/2);
      const y2 = cy + r*Math.sin(-Math.PI/2);
      const x3 = cx + r*Math.cos(-Math.PI/2+ang);
      const y3 = cy + r*Math.sin(-Math.PI/2+ang);
      const large = ang > Math.PI ? 1 : 0;
      inner = `<path d="M ${cx} ${cy} L ${x2} ${y2} A ${r} ${r} 0 ${large} 1 ${x3} ${y3} Z" fill="none" stroke="currentColor" stroke-width="2"/>`
        + label(cx, cy+20, spec.angle+'°')
        // Radius label sits to the LEFT of the vertical start-radius line, i.e.
        // outside the sector (which always sweeps to the right of that line).
        + (spec.r ? label(cx-8, (cy+y2)/2, fmt(spec.r, spec.unit), 'end') : '');
      break;
    }
    case 'trapezium': {
      const bx=36, by=90, bw=110, tx=64, ty=24, tw=54;
      // Avoid drawing the smaller value on the visually longer edge (or vice versa)
      const big = Math.max(spec.a, spec.b), small = Math.min(spec.a, spec.b);
      const p = `${bx},${by} ${bx+bw},${by} ${tx+tw},${ty} ${tx},${ty}`;
      inner = `<polygon points="${p}" fill="none" stroke="currentColor" stroke-width="2"/>`
        + dashedLine(tx+10,ty,tx+10,by)
        + label(tx+tw/2, ty-6, fmt(small, spec.unit))
        + label(bx+bw/2, by+16, fmt(big, spec.unit))
        + label(tx-10, (ty+by)/2, fmt(spec.height, spec.unit), 'end');
      break;
    }
    case 'generic_kite':
    case 'rhombus':
    case 'kite': {
      const cx=90, cy=72;
      const isKite = spec.shape !== 'rhombus';
      const topY = cy-44, botY = isKite ? cy+34 : cy+44, leftX = cx-34, rightX = cx+34;
      const p = `${cx},${topY} ${rightX},${cy} ${cx},${botY} ${leftX},${cy}`;
      inner = `<polygon points="${p}" fill="none" stroke="currentColor" stroke-width="2"/>`
        + dashedLine(cx,topY,cx,botY)
        + dashedLine(leftX,cy,rightX,cy);
      // Labels sit outside the shape entirely — above the top vertex for the vertical
      // diagonal, right of the right vertex for the horizontal one — so they never
      // overlap each other or spill past the shape's (narrowing) outline.
      const vertLabelPos = [cx, topY-12];
      const horizLabelPos = [rightX+10, cy+4];
      if(spec.shape === 'generic_kite'){
        inner += label(vertLabelPos[0], vertLabelPos[1], 'd\u2081')
               + label(horizLabelPos[0], horizLabelPos[1], 'd\u2082', 'start');
      } else {
        const d1n = spec.d1, d2n = spec.d2;
        let vertVal = d1n, horizVal = d2n;
        if(typeof d1n === 'number' && typeof d2n === 'number' && d2n > d1n){
          vertVal = d2n; horizVal = d1n;
        }
        inner += label(vertLabelPos[0], vertLabelPos[1], fmt(vertVal, spec.unit))
               + label(horizLabelPos[0], horizLabelPos[1], fmt(horizVal, spec.unit), 'start');
      }
      break;
    }
    case 'composite_rect_triangle': {
      const x=30,y=46,w=90,h=48;
      const apexY = y-24;
      inner = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="currentColor" stroke-width="2"/>`
        + `<polygon points="${x},${y} ${x+w},${y} ${x+w/2},${apexY}" fill="none" stroke="currentColor" stroke-width="2"/>`
        + label(x+w/2, y+h+16, 'rect: '+spec.rw+'\u00d7'+spec.rh+' '+spec.unit)
        + label(x+w/2, apexY-10, 'tri: b='+spec.tb+', h='+spec.th+' '+spec.unit, 'middle');
      break;
    }
    case 'composite_two_rects': {
      const x=30,y=26,w1=60,h1=36,w2=30,h2=64;
      inner = `<rect x="${x}" y="${y}" width="${w1}" height="${h1}" fill="none" stroke="currentColor" stroke-width="2"/>`
        + `<rect x="${x}" y="${y+h1}" width="${w2}" height="${h2-h1}" fill="none" stroke="currentColor" stroke-width="2"/>`
        + label(x+w1/2, y-8, spec.w1+'\u00d7'+spec.h1+' '+spec.unit)
        + label(x+w2+34, y+h1+18, spec.w2+'\u00d7'+spec.h2+' '+spec.unit);
      break;
    }
    case 'composite_rect_minus_square': {
      const x=30,y=26,w=110,h=64,sq=26;
      inner = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="currentColor" stroke-width="2"/>`
        + `<rect x="${x+w-sq}" y="${y}" width="${sq}" height="${sq}" fill="var(--paper)" stroke="currentColor" stroke-width="1.3" stroke-dasharray="3,2"/>`
        + label(x+w/2, y-8, spec.rw+'\u00d7'+spec.rh+' '+spec.unit)
        + label(x+w-sq/2, y+sq+12, spec.sq+'\u00d7'+spec.sq, 'middle');
      break;
    }
    case 'unit_square': {
      inner = `<rect x="56" y="34" width="60" height="60" fill="none" stroke="currentColor" stroke-width="2"/>`
        + label(88, 68, 'Area', 'middle');
      break;
    }
    case 'unit_convert': {
      inner = `<rect x="24" y="40" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2"/>`
        + label(39, 84, spec.fromU, 'middle')
        + `<line x1="66" y1="55" x2="106" y2="55" stroke="currentColor" stroke-width="2" marker-end="url(#arrowend)"/>`
        + `<rect x="118" y="24" width="46" height="46" fill="none" stroke="currentColor" stroke-width="2"/>`
        + label(141, 84, spec.toU, 'middle')
        + `<defs><marker id="arrowend" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="currentColor"/></marker></defs>`;
      break;
    }
    default:
      inner = '';
  }
  const CIRCLE_FAMILY = ['circle','generic_circle','semicircle','quadrant','sector'];
  const scale = (CIRCLE_FAMILY.includes(spec.shape) || isRhombusFamily) ? 2 : 1;
  const renderW = Math.round(W*scale), renderH = Math.round(H*scale);
  return `<svg viewBox="0 0 ${W} ${H}" width="${renderW}" height="${renderH}" class="q-diagram" aria-hidden="true" focusable="false">${inner}</svg>`;
}

function renderMcq(pageId, tier, qi, q){
  let optsHtml = '';
  q.opts.forEach((opt, oi)=>{
    const label = String.fromCharCode(65+oi);
    const ariaText = stripHtmlForAria(opt.t);
    optsHtml += `<button type="button" class="mcq-btn" data-page="${pageId}" data-tier="${tier}" data-qi="${qi}" data-oi="${oi}" onclick="mcqAns(this)" aria-label="Option ${label}: ${ariaText}">${label}. ${opt.t}</button>`;
  });
  return `
    <div class="q-text">${q.q}</div>
    <div class="mcq-options">${optsHtml}</div>
    <div class="mcq-feedback" id="fb-${pageId}-${tier}-${qi}"></div>
  `;
}

function renderTypein(pageId, tier, qi, q){
  const closerBadge = q.closer ? '<span class="closer-badge">Challenge</span><br>' : '';
  return `
    ${closerBadge}
    <div class="q-text">${q.q}</div>
    <div class="typein-row">
      <input type="text" inputmode="decimal" id="ti-${pageId}-${tier}-${qi}" aria-label="Type your numeric answer">
      <span class="unit-label">${q.unit || ''}</span>
      <button type="button" class="btn-check" onclick="checkTypein('${pageId}','${tier}',${qi})">Check</button>
    </div>
    <div class="mcq-feedback" id="fb-${pageId}-${tier}-${qi}"></div>
  `;
}

function renderEd(pageId, tier, qi, q){
  let stepsHtml = '';
  q.steps.forEach((s, si)=>{
    stepsHtml += `<button type="button" class="ed-step" data-page="${pageId}" data-tier="${tier}" data-qi="${qi}" data-si="${si}" onclick="edPick(this)">${s.t}</button>`;
  });
  return `
    <div class="q-text">Error Detective: click the one step that contains the mistake.<br>${q.q}</div>
    <div class="ed-steps">${stepsHtml}</div>
    <div class="mcq-feedback" id="fb-${pageId}-${tier}-${qi}"></div>
  `;
}

function renderQuestion(pageId, tier, qi, q, num){
  let inner = '';
  if(q.type === 'mc') inner = renderMcq(pageId, tier, qi, q);
  else if(q.type === 'ti') inner = renderTypein(pageId, tier, qi, q);
  else if(q.type === 'ed') inner = renderEd(pageId, tier, qi, q);
  let diagramHtml = '';
  if(q.dg && (tier === 'foundation' || tier === 'core')){
    diagramHtml = `<div class="q-diagram-wrap">${diagramSvg(q.dg)}</div>`;
  }
  return `<div class="q-block"><div class="q-num">Question ${num}</div>${diagramHtml}${inner}</div>`;
}

function buildPages(){
  const nav = document.getElementById('pageNav');
  const container = document.getElementById('pagesContainer');
  let navHtml = '';
  let pagesHtml = '';

  PAGE_DATA.forEach((page, pIdx)=>{
    navHtml += `<button type="button" class="page-nav-btn ${pIdx===0?'active':''}" data-page="${page.id}" style="--page-accent:${page.accent}" onclick="showPage(${page.id})">Page ${page.id}</button>`;

    let tierTabsHtml = '';
    let tierPanelsHtml = '';
    TIER_ORDER.forEach((tier, tIdx)=>{
      tierTabsHtml += `<button type="button" class="tier-tab ${tIdx===0?'active':''}" data-page="${page.id}" data-tier="${tier}" style="--page-accent:${page.accent}" onclick="showTier(${page.id}, '${tier}')">${TIER_LABELS[tier]}</button>`;
      let qsHtml = '';
      page[tier].forEach((q, qi)=>{
        qsHtml += renderQuestion(page.id, tier, qi, q, qi+1);
      });
      tierPanelsHtml += `<div class="tier-panel ${tIdx===0?'active':''}" id="panel-${page.id}-${tier}">${qsHtml}</div>`;
    });

    pagesHtml += `
      <section class="page-section ${pIdx===0?'active':''}" id="page-${page.id}" style="--page-accent:${page.accent}">
        <div class="page-title-row">
          <h2>Page ${page.id} — ${page.title}</h2>
        </div>
        <p class="page-meta">Foundation (MC only) &middot; Core (mixed) &middot; Extension (mixed + Error Detective + challenge)</p>
        <div class="tier-tabs">${tierTabsHtml}</div>
        <div class="tier-panels">${tierPanelsHtml}</div>
        <div class="confidence-block">
          <p>How confident do you feel with this sub-topic?</p>
          <div class="confidence-btns" data-page="${page.id}">
            <button type="button" data-val="unsure" onclick="setConfidence(${page.id}, 'unsure', this)" aria-label="Still unsure">&#128528;</button>
            <button type="button" data-val="getting" onclick="setConfidence(${page.id}, 'getting', this)" aria-label="Getting there">&#128578;</button>
            <button type="button" data-val="got" onclick="setConfidence(${page.id}, 'got', this)" aria-label="Got it">&#128522;</button>
          </div>
          <p class="confidence-note">Saved on this device only.</p>
        </div>
      </section>
    `;
  });

  nav.innerHTML = navHtml;
  container.innerHTML = pagesHtml;
  restoreConfidence();
  applyHashNavigation();
}

function applyHashNavigation(){
  const hash = window.location.hash.replace('#','');
  const match = hash.match(/^page-(\d+)$/);
  if(match){
    const pageId = parseInt(match[1]);
    if(PAGE_DATA.find(p=>p.id === pageId)){
      showPage(pageId);
    }
  }
}
window.addEventListener('hashchange', applyHashNavigation);

function showPage(pageId){
  document.querySelectorAll('.page-section').forEach(s=>s.classList.remove('active'));
  document.getElementById('page-'+pageId).classList.add('active');
  document.querySelectorAll('.page-nav-btn').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-page') == pageId);
  });
}

function showTier(pageId, tier){
  TIER_ORDER.forEach(t=>{
    const panel = document.getElementById('panel-'+pageId+'-'+t);
    if(panel) panel.classList.toggle('active', t===tier);
  });
  document.querySelectorAll(`.tier-tab[data-page="${pageId}"]`).forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-tier')===tier);
  });
}

function findQuestion(pageId, tier, qi){
  const page = PAGE_DATA.find(p=>p.id == pageId);
  return page[tier][qi];
}

function mcqAns(el){
  const pageId = el.getAttribute('data-page');
  const tier = el.getAttribute('data-tier');
  const qi = parseInt(el.getAttribute('data-qi'));
  const oi = parseInt(el.getAttribute('data-oi'));
  const q = findQuestion(pageId, tier, qi);
  const opt = q.opts[oi];
  const group = el.parentElement;
  const fb = document.getElementById(`fb-${pageId}-${tier}-${qi}`);

  if(group.querySelector('.mcq-btn.locked')) return;

  if(opt.c){
    group.querySelectorAll('.mcq-btn').forEach(b=>{ b.classList.add('locked'); b.classList.add('dim'); });
    el.classList.remove('dim');
    el.classList.add('correct-pick');
    fb.className = 'mcq-feedback show correct';
    fb.innerHTML = '&#10003; ' + opt.m;
  } else {
    el.classList.add('wrong-pick');
    fb.className = 'mcq-feedback show wrong';
    fb.innerHTML = '&#10007; ' + opt.m; // stays visible until corrected — no auto-clear timeout
  }
}

function checkTypein(pageId, tier, qi){
  const q = findQuestion(pageId, tier, qi);
  const input = document.getElementById(`ti-${pageId}-${tier}-${qi}`);
  const fb = document.getElementById(`fb-${pageId}-${tier}-${qi}`);
  const raw = input.value.replace(/[$,\s]/g,'');
  const val = parseFloat(raw);
  if(isNaN(val)){
    fb.innerHTML = 'Enter a number first.';
    fb.className = 'mcq-feedback show wrong';
    return;
  }
  if(Math.abs(val - q.ans) <= q.tol){
    fb.innerHTML = '&#10003; ' + q.cm;
    fb.className = 'mcq-feedback show correct';
    input.disabled = true;
  } else {
    fb.innerHTML = '&#10007; ' + q.wm; // stays visible until corrected — no auto-clear timeout
    fb.className = 'mcq-feedback show wrong';
  }
}

function edPick(el){
  const pageId = el.getAttribute('data-page');
  const tier = el.getAttribute('data-tier');
  const qi = parseInt(el.getAttribute('data-qi'));
  const si = parseInt(el.getAttribute('data-si'));
  const q = findQuestion(pageId, tier, qi);
  const group = el.parentElement;
  const fb = document.getElementById(`fb-${pageId}-${tier}-${qi}`);

  if(group.querySelector('.ed-step.locked')) return;

  if(si === q.errIdx){
    group.querySelectorAll('.ed-step').forEach(s=>s.classList.add('locked'));
    el.classList.add('correct-pick');
    fb.className = 'mcq-feedback show correct';
    fb.innerHTML = '&#10003; ' + q.cf;
  } else {
    el.classList.add('wrong-pick');
    fb.className = 'mcq-feedback show wrong';
    fb.innerHTML = '&#10007; ' + q.steps[si].explain; // stays visible until corrected — no auto-clear timeout
  }
}

function setConfidence(pageId, val, btn){
  const group = btn.parentElement;
  group.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  try{
    localStorage.setItem('are-trn-conf-p'+pageId, val);
  }catch(e){}
}

function restoreConfidence(){
  PAGE_DATA.forEach(page=>{
    let val = null;
    try{ val = localStorage.getItem('are-trn-conf-p'+page.id); }catch(e){}
    if(!val) return;
    const group = document.querySelector(`.confidence-btns[data-page="${page.id}"]`);
    if(!group) return;
    const btn = group.querySelector(`button[data-val="${val}"]`);
    if(btn) btn.classList.add('selected');
  });
}

buildPages();
</script>

</body>
</html>
