n class=\"frac\"><span class=\"num\">3</span><span class=\"den\">4</span></span> as a percentage.", "options": [{"t": "43%", "c": false, "m": "Check the division again: 3 &divide; 4."}, {"t": "34%", "c": false, "m": "That's the digits of the fraction reversed &mdash; try dividing 3 by 4."}, {"t": "3.4%", "c": false, "m": "A decimal point has slipped &mdash; 3 &divide; 4 = 0.75."}, {"t": "75%", "c": true, "m": "3 &divide; 4 = 0.75 = 75%."}], "dg": null}, {"type": "mc", "prompt": "A bag contains 5 red, 3 blue and 2 green counters (10 total). What is P(green)?", "options": [{"t": "<span class=\"frac\"><span class=\"num\">2</span><span class=\"den\">10</span></span>", "c": true, "m": "2 green counters out of 10 total."}, {"t": "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">10</span></span>", "c": false, "m": "That's the probability of blue, not green."}, {"t": "<span class=\"frac\"><span class=\"num\">5</span><span class=\"den\">10</span></span>", "c": false, "m": "That's the probability of red, not green."}, {"t": "<span class=\"frac\"><span class=\"num\">10</span><span class=\"den\">2</span></span>", "c": false, "m": "This is upside down &mdash; favourable outcomes go on top."}], "dg": {"shape": "bag", "counts": [["#C1614F", 5], ["#3D5A80", 3], ["#4A7C59", 2]]}}, {"type": "mc", "prompt": "Which of these values could NOT be a probability?", "options": [{"t": "0%", "c": false, "m": "0% is valid &mdash; it means the event is impossible."}, {"t": "50%", "c": false, "m": "50% is valid &mdash; it means an event is equally likely to happen or not."}, {"t": "100%", "c": false, "m": "100% is valid &mdash; it means the event is certain."}, {"t": "120%", "c": true, "m": "Probabilities can't exceed 100% (or 1)."}], "dg": null}, {"type": "mc", "prompt": "A bag has red, blue and green counters. P(red) = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">5</span></span> and P(blue) = <span class=\"frac\"><span class=\"num\">2</span><span class=\"den\">5</span></span>. What is P(green)?", "options": [{"t": "<span class=\"frac\"><span class=\"num\">4</span><span class=\"den\">5</span></span>", "c": false, "m": "Check the sum again &mdash; all three probabilities must add to 1."}, {"t": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">5</span></span>", "c": false, "m": "That's the same as P(red) &mdash; the probabilities can't both be <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">5</span></span> unless stated."}, {"t": "<span class=\"frac\"><span class=\"num\">2</span><span class=\"den\">5</span></span>", "c": true, "m": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">5</span></span> + <span class=\"frac\"><span class=\"num\">2</span><span class=\"den\">5</span></span> + <span class=\"frac\"><span class=\"num\">2</span><span class=\"den\">5</span></span> = 1, so P(green) = <span class=\"frac\"><span class=\"num\">2</span><span class=\"den\">5</span></span>."}, {"t": "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">5</span></span>", "c": false, "m": "Check the sum again &mdash; all three probabilities must add to 1."}], "dg": null}, {"type": "mc", "prompt": "The probabilities of every outcome in a sample space always sum to:", "options": [{"t": "0", "c": false, "m": "A sum of 0 would mean nothing can ever happen."}, {"t": "1", "c": true, "m": "Always 1, no matter how many outcomes there are."}, {"t": "10", "c": false, "m": "Probabilities are between 0 and 1, so the total is 1, not 10."}, {"t": "It depends on the spinner", "c": false, "m": "The total is always 1, regardless of the spinner design."}], "dg": {"shape": "spinner", "segments": [["#3D5A80", 1], ["#C1614F", 1], ["#4A7C59", 1], ["#E89C2F", 1]]}}], "core": [{"type": "mc", "prompt": "A 12-sided die is numbered 1&ndash;12 and rolled once. What is P(rolling a number greater than 8)?", "options": [{"t": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">4</span></span>", "c": false, "m": "That would only count 9, 10 and 11 &mdash; check whether 12 also qualifies."}, {"t": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">3</span></span>", "c": true, "m": "9, 10, 11, 12 are greater than 8: 4 out of 12 = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">3</span></span>."}, {"t": "<span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">12</span></span>", "c": false, "m": "This uses \"8 or less\" as the favourable count, which is the opposite of what was asked."}, {"t": "<span class=\"frac\"><span class=\"num\">4</span><span class=\"den\">8</span></span>", "c": false, "m": "The total number of outcomes is 12, not 8."}], "dg": null}, {"type": "typein", "prompt": "A spinner has 5 equal sectors numbered 1&ndash;5. How many outcomes are in the sample space?", "answer": 5, "tol": 0.01, "correctMsg": "Correct! One outcome for each numbered sector: 5 in total.", "wrongMsg": "Not quite. Count the sectors on the spinner.", "dg": null}, {"type": "mc", "prompt": "Convert 0.6 to a percentage.", "options": [{"t": "6%", "c": false, "m": "A decimal point has slipped &mdash; try again."}, {"t": "0.6%", "c": false, "m": "A decimal point has slipped &mdash; try again."}, {"t": "60%", "c": true, "m": "0.6 &times; 100 = 60%."}, {"t": "160%", "c": false, "m": "Percentages above 100% mean more than the whole &mdash; that's not right here."}], "dg": null}, {"type": "typein", "prompt": "A bag has 20 counters. P(red) = 0.25. How many counters are red?", "answer": 5, "tol": 0.01, "correctMsg": "Correct! 0.25 of 20 counters is 5.", "wrongMsg": "Not quite. Multiply 20 by 0.25.", "dg": null}, {"type": "mc", "prompt": "There are 13 cards numbered 1&ndash;13, shuffled. What is P(drawing a multiple of 4)?", "options": [{"t": "<span class=\"frac\"><span class=\"num\">4</span><span class=\"den\">13</span></span>", "c": false, "m": "4, 8 and 12 are multiples of 4 &mdash; count them again."}, {"t": "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">12</span></span>", "c": false, "m": "The total number of cards is 13, not 12."}, {"t": "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">13</span></span>", "c": true, "m": "4, 8 and 12 are multiples of 4: 3 out of 13 cards."}, {"t": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">4</span></span>", "c": false, "m": "This simplifies a fraction that was never correct to begin with."}], "dg": null}, {"type": "mc", "prompt": "A spinner has 10 equal sections: 4 orange, 3 purple, 3 pink. What is P(NOT orange)?", "options": [{"t": "<span class=\"frac\"><span class=\"num\">4</span><span class=\"den\">10</span></span>", "c": false, "m": "That's the probability of orange itself, not NOT orange."}, {"t": "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">5</span></span>", "c": true, "m": "6 non-orange sections (3 purple + 3 pink) out of 10 = <span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">5</span></span>."}, {"t": "<span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">10</span></span>", "c": false, "m": "Check the non-orange count again &mdash; 3 + 3 = 6, not 7."}, {"t": "<span class=\"frac\"><span class=\"num\">6</span><span class=\"den\">4</span></span>", "c": false, "m": "This is upside down &mdash; favourable outcomes go on top."}], "dg": null}, {"type": "mc", "prompt": "Which decimal equals <span class=\"frac\"><span class=\"num\">9</span><span class=\"den\">20</span></span>?", "options": [{"t": "0.45", "c": true, "m": "9 &divide; 20 = 0.45."}, {"t": "0.9", "c": false, "m": "That's <span class=\"frac\"><span class=\"num\">9</span><span class=\"den\">10</span></span>, not <span class=\"frac\"><span class=\"num\">9</span><span class=\"den\">20</span></span>."}, {"t": "4.5", "c": false, "m": "A decimal point has slipped &mdash; try dividing 9 by 20 again."}, {"t": "0.09", "c": false, "m": "A decimal point has slipped &mdash; try dividing 9 by 20 again."}], "dg": null}, {"type": "mc", "prompt": "A standard die is rolled once. Which event has the HIGHEST theoretical probability?", "options": [{"t": "Rolling greater than 4", "c": false, "m": "This is P = <span class=\"frac\"><span class=\"num\">2</span><span class=\"den\">6</span></span> = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">3</span></span> &mdash; check the others."}, {"t": "Rolling a 6", "c": false, "m": "This is P = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">6</span></span> &mdash; the smallest of all four options."}, {"t": "Rolling less than 3", "c": false, "m": "This is P = <span class=\"frac\"><span class=\"num\">2</span><span class=\"den\">6</span></span> = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">3</span></span> &mdash; check the others."}, {"t": "Rolling an even number", "c": true, "m": "P(even) = <span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">6</span></span> = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>, higher than the other three options."}], "dg": null}, {"type": "typein", "prompt": "A spinner has 25 equal sections. P(green) = 0.2. How many sections are green?", "answer": 5, "tol": 0.01, "correctMsg": "Correct! 0.2 of 25 sections is 5.", "wrongMsg": "Not quite. Multiply 25 by 0.2.", "dg": null}], "extension": [{"type": "mc", "prompt": "A 20-sided die is numbered 1&ndash;20 and rolled once. What is P(rolling a factor of 20)?", "options": [{"t": "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">20</span></span>", "c": false, "m": "The factors of 20 are 1, 2, 4, 5, 10, 20 &mdash; count them again."}, {"t": "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">10</span></span>", "c": true, "m": "Factors of 20: 1, 2, 4, 5, 10, 20 &mdash; that\u2019s 6 out of 20, which simplifies to <span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">10</span></span>."}, {"t": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">4</span></span>", "c": false, "m": "Some factors have been missed &mdash; list all factors of 20 first."}, {"t": "<span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">20</span></span>", "c": false, "m": "One extra number has been counted that is not actually a factor of 20."}], "dg": null}, {"type": "typein", "prompt": "A spinner has 40 equal sections. P(red) = 0.35. How many sections are red?", "answer": 14, "tol": 0.01, "correctMsg": "Correct! 0.35 of 40 sections is 14.", "wrongMsg": "Not quite. Multiply 40 by 0.35.", "dg": null}, {"type": "mc", "prompt": "Write <span class=\"frac\"><span class=\"num\">18</span><span class=\"den\">24</span></span> as a percentage.", "options": [{"t": "18%", "c": false, "m": "The fraction needs to be simplified or converted first, not read directly."}, {"t": "75%", "c": true, "m": "18 &divide; 24 = 0.75 = 75%."}, {"t": "24%", "c": false, "m": "That's the denominator, not the result of the division."}, {"t": "133%", "c": false, "m": "A percentage above 100% would mean more than the whole amount."}], "dg": null}, {"type": "mc", "prompt": "A 12-section spinner needs to be designed so that P(gold) = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">3</span></span>. Which design works?", "options": [{"t": "3 gold sections", "c": false, "m": "3 out of 12 gives P(gold) = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">4</span></span>, not <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">3</span></span>."}, {"t": "6 gold sections", "c": false, "m": "6 out of 12 gives P(gold) = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>, not <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">3</span></span>."}, {"t": "4 gold sections", "c": true, "m": "4 out of 12 simplifies to <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">3</span></span>."}, {"t": "2 gold sections", "c": false, "m": "2 out of 12 gives P(gold) = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">6</span></span>, not <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">3</span></span>."}], "dg": null}, {"type": "mc", "prompt": "A bag has 30 counters, only red and blue. P(red) = 0.4. How many MORE blue counters are there than red?", "options": [{"t": "6", "c": true, "m": "Red = 12, blue = 18. 18 &minus; 12 = 6."}, {"t": "12", "c": false, "m": "That's the number of red counters, not the difference."}, {"t": "18", "c": false, "m": "That's the number of blue counters, not the difference."}, {"t": "3", "c": false, "m": "Check both counts (red = 12, blue = 18) before subtracting."}], "dg": null}, {"type": "ed", "prompt": "A student says: \"A spinner has 5 sections &mdash; 2 orange, 2 purple, 1 grey. Since there are 3 colours, P(orange) = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">3</span></span>.\" What is the mistake?", "options": [{"t": "Miscounted the orange sections", "c": false, "m": "The orange count (2) is correct &mdash; the mistake is elsewhere."}, {"t": "Forgot that grey is a valid outcome", "c": false, "m": "Grey was included in the count of colours, so it wasn\u2019t forgotten."}, {"t": "Should have added the sections instead of dividing", "c": false, "m": "The favourable-over-total structure is correct &mdash; it's the total that's wrong."}, {"t": "Used the number of colours (3) as the total instead of the number of sections (5)", "c": true, "m": "There are 5 equally-sized sections, so the total must be 5, not the number of different colours. P(orange) = <span class=\"frac\"><span class=\"num\">2</span><span class=\"den\">5</span></span>."}], "dg": null}, {"type": "typein", "prompt": "A raffle has 40 tickets. Prize A has 5 winning tickets and Prize B has 8 winning tickets (no ticket wins both). P(winning any prize) = 0.6. How many winning tickets belong to Prize C?", "answer": 11, "tol": 0.01, "correctMsg": "Correct! 0.6 &times; 40 = 24 total winning tickets. 24 &minus; 5 &minus; 8 = 11.", "wrongMsg": "Not quite. First find the total number of winning tickets (0.6 &times; 40), then subtract the tickets already accounted for in Prizes A and B.", "dg": null}]}, "2": {"foundation": [{"type": "mc", "prompt": "A coin is tossed 50 times and lands heads 27 times. What is the relative frequency of heads?", "options": [{"t": "<span class=\"frac\"><span class=\"num\">23</span><span class=\"den\">50</span></span>", "c": false, "m": "That's the number of tails, not heads."}, {"t": "<span class=\"frac\"><span class=\"num\">27</span><span class=\"den\">50</span></span>", "c": true, "m": "27 heads out of 50 total tosses."}, {"t": "<span class=\"frac\"><span class=\"num\">50</span><span class=\"den\">27</span></span>", "c": false, "m": "This is upside down &mdash; favourable outcomes go on top."}, {"t": "<span class=\"frac\"><span class=\"num\">27</span><span class=\"den\">100</span></span>", "c": false, "m": "The total number of tosses was 50, not 100."}], "dg": null}, {"type": "mc", "prompt": "A die is rolled 40 times. A \"3\" appears 5 times. What is the observed probability of rolling a 3?", "options": [{"t": "<span class=\"frac\"><span class=\"num\">5</span><span class=\"den\">35</span></span>", "c": false, "m": "The total number of trials is 40, not 35."}, {"t": "<span class=\"frac\"><span class=\"num\">35</span><span class=\"den\">40</span></span>", "c": false, "m": "This uses the number of times a 3 did NOT appear as the favourable count."}, {"t": "<span class=\"frac\"><span class=\"num\">40</span><span class=\"den\">5</span></span>", "c": false, "m": "This is upside down &mdash; favourable outcomes go on top."}, {"t": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">8</span></span>", "c": true, "m": "5 out of 40 simplifies to <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">8</span></span>."}], "dg": {"shape": "die", "pips": 3}}, {"type": "mc", "prompt": "A spinner is spun 20 times: Red comes up 6 times, Blue comes up 14 times. What is the relative frequency of Blue?", "options": [{"t": "<span class=\"frac\"><span class=\"num\">14</span><span class=\"den\">20</span></span>", "c": true, "m": "14 Blue results out of 20 total spins."}, {"t": "<span class=\"frac\"><span class=\"num\">6</span><span class=\"den\">20</span></span>", "c": false, "m": "That's the relative frequency of Red, not Blue."}, {"t": "<span class=\"frac\"><span class=\"num\">20</span><span class=\"den\">14</span></span>", "c": false, "m": "This is upside down &mdash; favourable outcomes go on top."}, {"t": "<span class=\"frac\"><span class=\"num\">6</span><span class=\"den\">14</span></span>", "c": false, "m": "This compares Red to Blue, not Blue to the total number of spins."}], "dg": null}, {"type": "mc", "prompt": "A bag has 3 red and 7 blue counters (10 total). What is the THEORETICAL probability of drawing red?", "options": [{"t": "<span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">10</span></span>", "c": false, "m": "That's the probability of blue, not red."}, {"t": "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">7</span></span>", "c": false, "m": "This compares red to blue, not red to the total."}, {"t": "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">10</span></span>", "c": true, "m": "3 red counters out of 10 total."}, {"t": "<span class=\"frac\"><span class=\"num\">10</span><span class=\"den\">3</span></span>", "c": false, "m": "This is upside down &mdash; favourable outcomes go on top."}], "dg": {"shape": "bag", "counts": [["#C1614F", 3], ["#3D5A80", 7]]}}, {"type": "mc", "prompt": "A coin is tossed only 10 times. Which statement about the relative frequency of heads is TRUE?", "options": [{"t": "It will always exactly equal <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>", "c": false, "m": "With only 10 tosses, the result often does not land exactly on <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>."}, {"t": "It cannot be calculated", "c": false, "m": "Relative frequency can always be calculated: heads &divide; total tosses."}, {"t": "It must be greater than the theoretical probability", "c": false, "m": "It could easily be lower than <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>, not just higher."}, {"t": "It may differ from the theoretical probability of <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>", "c": true, "m": "With few trials, relative frequency often differs from the theoretical value &mdash; it tends to settle closer with more trials."}], "dg": null}, {"type": "mc", "prompt": "A die is rolled 50 times, giving these results: 1&rarr;8, 2&rarr;9, 3&rarr;7, 4&rarr;8, 5&rarr;10, 6&rarr;8. What is the relative frequency of rolling a 5?", "options": [{"t": "<span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">50</span></span>", "c": false, "m": "That's the frequency for rolling a 1 (or a 4, or a 6), not a 5."}, {"t": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">5</span></span>", "c": true, "m": "10 out of 50 simplifies to <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">5</span></span>."}, {"t": "<span class=\"frac\"><span class=\"num\">9</span><span class=\"den\">50</span></span>", "c": false, "m": "That's the frequency for rolling a 2, not a 5."}, {"t": "<span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">50</span></span>", "c": false, "m": "That's the frequency for rolling a 3, not a 5."}], "dg": {"shape": "die", "pips": 5}}, {"type": "mc", "prompt": "Which word describes a probability found by actually carrying out an experiment, rather than calculating it in advance?", "options": [{"t": "Theoretical", "c": false, "m": "Theoretical probability is calculated in advance, before any trials are run."}, {"t": "Random", "c": false, "m": "Random describes the experiment itself, not the type of probability."}, {"t": "Experimental", "c": true, "m": "Experimental (or observed) probability comes from actually running the trials."}, {"t": "Impossible", "c": false, "m": "Impossible describes a probability of 0, not a type of probability."}], "dg": null}, {"type": "mc", "prompt": "A spinner is spun 100 times and lands on green 55 times. As a percentage, the relative frequency of green is:", "options": [{"t": "55%", "c": true, "m": "55 out of 100 is 55%."}, {"t": "45%", "c": false, "m": "That's the percentage of spins that did NOT land on green."}, {"t": "5.5%", "c": false, "m": "A decimal point has slipped."}, {"t": "100%", "c": false, "m": "That's the total number of spins, not the percentage that landed on green."}], "dg": null}], "core": [{"type": "mc", "prompt": "A spinner is spun 80 times and lands on yellow 20 times. What PERCENTAGE of spins landed on yellow?", "options": [{"t": "20%", "c": false, "m": "That's the raw count, not the percentage."}, {"t": "25%", "c": true, "m": "20 out of 80 = 0.25 = 25%."}, {"t": "80%", "c": false, "m": "That's the total number of spins, not the percentage that landed on yellow."}, {"t": "4%", "c": false, "m": "Check the division again: 20 &divide; 80."}], "dg": null}, {"type": "typein", "prompt": "A coin is tossed 200 times and lands heads 118 times. What is the relative frequency of heads, as a decimal (2 d.p.)?", "answer": 0.59, "tol": 0.01, "correctMsg": "Correct! 118 &divide; 200 = 0.59.", "wrongMsg": "Not quite. Divide the number of heads by the total number of tosses.", "dg": null}, {"type": "mc", "prompt": "A 12-sided die numbered 1&ndash;12 is rolled once. What is the THEORETICAL probability of rolling a number greater than 8?", "options": [{"t": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">3</span></span>", "c": true, "m": "9, 10, 11, 12 are greater than 8: 4 out of 12 = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">3</span></span>."}, {"t": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">4</span></span>", "c": false, "m": "This only counts 9, 10 and 11 &mdash; check whether 12 also qualifies."}, {"t": "<span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">12</span></span>", "c": false, "m": "This uses \"8 or less\" as the favourable count, the opposite of what was asked."}, {"t": "<span class=\"frac\"><span class=\"num\">4</span><span class=\"den\">8</span></span>", "c": false, "m": "The total number of outcomes is 12, not 8."}], "dg": {"shape": "die", "pips": 1}}, {"type": "typein", "prompt": "A die is rolled 60 times. A \"1\" appears 15 times. What is the observed probability of rolling a 1, as a decimal?", "answer": 0.25, "tol": 0.01, "correctMsg": "Correct! 15 &divide; 60 = 0.25.", "wrongMsg": "Not quite. Divide 15 by 60.", "dg": null}, {"type": "mc", "prompt": "Which statement best explains why relative frequency tends to get closer to theoretical probability as the number of trials increases?", "options": [{"t": "Because early results are always wrong", "c": false, "m": "Early results are not \"wrong\" &mdash; they simply come from fewer trials."}, {"t": "Because dice and spinners change over time", "c": false, "m": "A fair die or spinner does not change &mdash; only the sample size changes."}, {"t": "Because probability only works for large numbers", "c": false, "m": "Probability applies to any number of trials, even one."}, {"t": "Results tend to even out over many trials", "c": true, "m": "With more trials, unusual short-term results are balanced out, so the relative frequency settles closer to the theoretical value."}], "dg": null}, {"type": "mc", "prompt": "A bag has 8 counters: 5 green, 3 orange. What is the THEORETICAL probability of drawing orange?", "options": [{"t": "<span class=\"frac\"><span class=\"num\">5</span><span class=\"den\">8</span></span>", "c": false, "m": "That's the probability of green, not orange."}, {"t": "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">5</span></span>", "c": false, "m": "This compares orange to green, not orange to the total."}, {"t": "<span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">3</span></span>", "c": false, "m": "This is upside down &mdash; favourable outcomes go on top."}, {"t": "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">8</span></span>", "c": true, "m": "3 orange counters out of 8 total."}], "dg": {"shape": "bag", "counts": [["#4A7C59", 5], ["#E89C2F", 3]]}}, {"type": "typein", "prompt": "A spinner is spun 150 times and lands on red 45 times. What is the relative frequency of red, as a decimal?", "answer": 0.3, "tol": 0.01, "correctMsg": "Correct! 45 &divide; 150 = 0.3.", "wrongMsg": "Not quite. Divide 45 by 150.", "dg": null}, {"type": "table_mc", "prompt": "A die is rolled 50 times, with results shown in the table. The relative frequencies of faces 1&ndash;5 are given. What must the relative frequency of rolling a 6 be (all six must sum to 1)?", "table": {"headers": ["Face", "1", "2", "3", "4", "5", "6"], "row": ["Rel. freq", "0.15", "0.18", "0.14", "0.19", "0.16", "?"]}, "options": [{"t": "0.82", "c": false, "m": "This is the sum of the other five &mdash; it still needs to be subtracted from 1."}, {"t": "0.18", "c": true, "m": "0.15+0.18+0.14+0.19+0.16 = 0.82, and 1 &minus; 0.82 = 0.18."}, {"t": "1.18", "c": false, "m": "Check the operation &mdash; the five given values should be subtracted from 1, not added to it."}, {"t": "0.20", "c": false, "m": "Check the sum of the five given relative frequencies again."}], "dg": null}, {"type": "mc", "prompt": "A relative frequency is calculated as:", "options": [{"t": "total trials &divide; favourable outcomes", "c": false, "m": "This is upside down &mdash; favourable outcomes go on top."}, {"t": "favourable outcomes &times; total trials", "c": false, "m": "Relative frequency is a division, not a multiplication."}, {"t": "favourable outcomes &divide; total trials", "c": true, "m": "Relative frequency = number of times an outcome occurred &divide; total number of trials."}, {"t": "total trials &minus; favourable outcomes", "c": false, "m": "Relative frequency is a division, not a subtraction."}], "dg": null}], "extension": [{"type": "mc", "prompt": "A coin is flipped 500 times and lands heads 267 times. Which statement is best supported by this data?", "options": [{"t": "The coin is definitely biased because 267 &ne; 250", "c": false, "m": "A difference this small over 500 trials is expected, even for a fair coin."}, {"t": "The relative frequency (0.534) is close to the theoretical probability of 0.5, consistent with a fair coin", "c": true, "m": "<span class=\"frac\"><span class=\"num\">267</span><span class=\"den\">500</span></span> = 0.534, which is close to 0.5 &mdash; this is the kind of variation expected from a fair coin over many trials."}, {"t": "The coin will land tails next time to balance things out", "c": false, "m": "This is the gambler's fallacy &mdash; each flip is independent of past results."}, {"t": "Relative frequency and theoretical probability must always be exactly equal", "c": false, "m": "They tend to get closer with more trials, but are rarely exactly equal."}], "dg": null}, {"type": "typein", "prompt": "A die is rolled 90 times. It lands on an even number 54 times. What is the relative frequency of rolling an even number, as a decimal?", "answer": 0.6, "tol": 0.01, "correctMsg": "Correct! 54 &divide; 90 = 0.6.", "wrongMsg": "Not quite. Divide 54 by 90.", "dg": null}, {"type": "mc", "prompt": "A spinner has 9 equal sections: 4 blue, 3 red, 2 yellow. What is the THEORETICAL probability of landing on red or yellow?", "options": [{"t": "<span class=\"frac\"><span class=\"num\">4</span><span class=\"den\">9</span></span>", "c": fal  relative frequency of tails is 100%, which means the coin will definitely land heads next.\" What is the mistake?", "options": [{"t": "The relative frequency should have been calculated as <span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">100</span></span>", "c": false, "m": "The relative frequency of <span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">8</span></span> = 100% is correctly calculated &mdash; the mistake is in what is concluded from it."}, {"t": "A small number of trials can give a relative frequency very different from the theoretical probability, and the coin isn\u2019t \"due\" for heads &mdash; each flip is independent", "c": true, "m": "8 trials is a small sample, so an unusual run is possible even with a fair coin. Since each flip is independent, the coin has no 'memory' of past results."}, {"t": "Coins only have a theoretical probability, not an experimental one", "c": false, "m": "Coins can have both a theoretical and an experimental (observed) probability."}, {"t": "The student forgot to convert to a percentage", "c": false, "m": "The student already correctly converted <span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">8</span></span> to 100%."}], "dg": null}, {"type": "typein", "prompt": "A die is rolled 300 times and the relative frequency of rolling a \"5\" is 0.22. A further 50 rolls are made, and \"5\" comes up 9 more times. What is the new OVERALL relative frequency of rolling a \"5\" (as a decimal, 2 d.p.)?", "answer": 0.21, "tol": 0.01, "correctMsg": "Correct! Originally 0.22 &times; 300 = 66 fives. New total = 66 + 9 = 75 fives out of 350 rolls. 75 &divide; 350 = 0.21 (2 d.p.).", "wrongMsg": "Not quite. First find the original number of 5s (0.22 &times; 300), add the 9 new ones, then divide by the new total number of rolls (350).", "dg": null}]}, "3": {"foundation": [{"type": "mc", "prompt": "What is the complement of \"rolling a 6\" on a die?", "options": [{"t": "Rolling a 5", "c": false, "m": "This is only one specific alternative outcome, not the full complement."}, {"t": "Rolling an even number", "c": false, "m": "This includes 6 itself, so it can't be the complement of rolling a 6."}, {"t": "Not rolling a 6", "c": true, "m": "The complement is every outcome that is NOT the event itself."}, {"t": "Rolling a 1", "c": false, "m": "This is only one specific alternative outcome, not the full complement."}], "dg": null}, {"type": "mc", "prompt": "P(rolling a 6) = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">6</span></span> on a standard die. What is P(NOT rolling a 6)?", "options": [{"t": "<span class=\"frac\"><span class=\"num\">5</span><span class=\"den\">6</span></span>", "c": true, "m": "An event and its complement always add to 1: 1 &minus; <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">6</span></span> = <span class=\"frac\"><span class=\"num\">5</span><span class=\"den\">6</span></span>."}, {"t": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">6</span></span>", "c": false, "m": "That's P(rolling a 6) again, not its complement."}, {"t": "<span class=\"frac\"><span class=\"num\">6</span><span class=\"den\">6</span></span>", "c": false, "m": "A probability of 1 would mean the event is certain, which is not the case here."}, {"t": "<span class=\"frac\"><span class=\"num\">4</span><span class=\"den\">6</span></span>", "c": false, "m": "Check the subtraction again: 1 &minus; <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">6</span></span>."}], "dg": {"shape": "die", "pips": 6}}, {"type": "mc", "prompt": "A spinner has 6 equal sections: 2 red, 3 green, 1 white. P(green) = <span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">6</span></span>. What is P(NOT green)?", "options": [{"t": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">6</span></span>", "c": false, "m": "That's the probability of white alone, not everything ex ": "mc", "prompt": "In a raffle, P(winning) = <span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">50</span></span>. What is P(NOT winning), as a decimal?", "options": [{"t": "0.06", "c": false, "m": "That's P(winning) as a decimal, not its complement."}, {"t": "0.94", "c": true, "m": "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">50</span></span> = 0.06, and 1 &minus; 0.06 = 0.94."}, {"t": "0.47", "c": false, "m": "Check the subtraction again: 1 &minus; 0.06."}, {"t": "1.06", "c": false, "m": "Check the subtraction: an event and its complement add to 1, not more than 1."}], "dg": null}, {"type": "mc", "prompt": "P(A) + P(NOT A) must always total 1. If P(A) = <span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">15</span></span>, what is P(NOT A)?", "options": [{"t": "<span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">15</span></span>", "c": false, "m": "That's P(A) again, not its complement."}, {"t": "<span class=\"frac\"><span class=\"num\">15</span><span class=\"den\">7</span></span>", "c": false, "m": "This is upside down &mdash; favourable outcomes go on top."}, {"t": "<span class=\"frac\"><span class=\"num\">22</span><span class=\"den\">15</span></span>", "c": false, "m": "Check the operation: 1 &minus; <span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">15</span></span>, not 1 + <span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">15</span></span>."}, {"t": "<span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">15</span></span>", "c": true, "m": "1 &minus; <span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">15</span></span> = <span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">15</span></span>."}], "dg": null}], "extension": [{"type": "mc", "prompt": "P(an event) = x. Which expression always equals P(NOT the event)?", "options": [{"t": "x &minus; 1", "c": false, "m": "This would give a negative value for any // ---------- Safe storage ----------
const memStore = {};
function safeGet(key, fallback){
  try { const v = localStorage.getItem(key); return v === null ? fallback : v; }
  catch(e){ return (key in memStore) ? memStore[key] : fallback; }
}
function safeSet(key, value){
  try { localStorage.setItem(key, value); }
  catch(e){ memStore[key] = value; }
}

// ---------- Font toggle ----------
const fontModes = [
  {cls:'', label:'Font: Nunito Sans'},
  {cls:'font-system', label:'Font: System'},
  {cls:'font-atkinson', label:'Font: Atkinson Hyperlegible'}
];
let fontIdx = parseInt(safeGet('pro-font', '0'), 10);
function applyFont(){
  document.body.classList.remove('font-system','font-atkinson');
  if(fontModes[fontIdx].cls) document.body.classList.add(fontModes[fontIdx].cls);
  document.getElementById('fontToggle').textContent = fontModes[fontIdx].label;
}
document.getElementById('fontToggle').addEventListener('click', ()=>{
  fontIdx = (fontIdx + 1) % fontModes.length;
  safeSet('pro-font', fontIdx);
  applyFont();
});
applyFont();

// ---------- Diagram engine ----------
function polarToCartesian(cx, cy, r, angleDeg){
  const a = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}
function describeSector(cx, cy, r, startAngle, endAngle){
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArc = (endAngle - startAngle) <= 180 ? '0' : '1';
  return ['M', cx, cy, 'L', start.x, start.y, 'A', r, r, 0, largeArc, 0, end.x, end.y, 'Z'].join(' ');
}
function spinnerMarkup(segments){
  const total = segments.reduce((a,s)=>a+s[1],0);
  let angle = 0, s = '';
  segments.forEach(seg=>{
    const sweep = 360 * seg[1] / total;
    s += `<path d="${describeSector(100,100,80,angle,angle+sweep)}" fill="${seg[0]}" stroke="#fff" stroke-width="2"></path>`;
    angle += sweep;
  });
  s += `<circle cx="100" cy="100" r="80" fill="none" stroke="#23303D" stroke-width="2"></circle>`;
  return `<svg width="140" height="140" viewBox="0 0 200 200" aria-label="Spinner diagram">${s}</svg>`;
}
const PIP_MAP = {
  1:[[50,50]], 2:[[25,25],[75,75]], 3:[[25,25],[50,50],[75,75]],
  4:[[25,25],[75,25],[25,75],[75,75]], 5:[[25,25],[75,25],[50,50],[25,75],[75,75]],
  6:[[25,25],[75,25],[25,50],[75,50],[25,75],[75,75]]
};
function dieMarkup(pips){
  const dots = PIP_MAP[pips].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="8" fill="#23303D"></circle>`).join('');
  return `<svg width="90" height="90" viewBox="0 0 100 100" aria-label="Die showing ${pips}"><rect x="4" y="4" width="92" height="92" rx="14" fill="#fff" stroke="#23303D" stroke-width="3"></rect>${dots}</svg>`;
}
function bagMarkup(counts){
  const total = counts.reduce((a,c)=>a+c[1],0);
  const cols = Math.ceil(Math.sqrt(total));
  const rows = Math.ceil(total / cols);
  const areaX0 = 40, areaX1 = 120, areaY0 = 42, areaY1 = 112;
  const cellW = (areaX1 - areaX0) / cols, cellH = (areaY1 - areaY0) / rows;
  let circles = [], i = 0;
  counts.forEach(c=>{
    for(let k=0;k<c[1];k++){
      const col = i % cols, row = Math.floor(i / cols);
      const cx = areaX0 + cellW*(col+0.5), cy = areaY0 + cellH*(row+0.5);
      circles.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="7" fill="${c[0]}"></circle>`);
      i++;
    }
  });
  const bagPath = `<path d="M40,20 L120,20 L135,120 A15,15 0 0,1 120,130 L40,130 A15,15 0 0,1 25,120 Z" fill="#EDE3D3" stroke="#23303D" stroke-width="3"></path>`;
  return `<svg width="140" height="120" viewBox="0 0 160 130" aria-label="Bag of counters">${bagPath}${circles.join('')}</svg>`;
}
function renderDiagram(dg){
  if(!dg) return '';
  if(dg.shape === 'die') return dieMarkup(dg.pips);
  if(dg.shape === 'spinner') return spinnerMarkup(dg.segments);
  if(dg.shape === 'bag') return bagMarkup(dg.counts);
  return '';
}

// ---------- Question renderers ----------
function renderOptions(qKey, q, container, isEd){
  const optWrap = document.createElement('div');
  optWrap.className = 'options';
  const fb = document.createElement('div');
  fb.className = 'feedback';
  q.options.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'opt';
    btn.innerHTML = opt.t;
    btn.addEventListener('click', ()=>{
      optWrap.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected-correct','selected-incorrect'));
      if(opt.c){
        btn.classList.add('selected-correct');
        fb.innerHTML = '&#10003; ' + opt.m;
        fb.className = 'feedback show correct';
        optWrap.querySelectorAll('.opt').forEach(o=>o.disabled = true);
      } else {
        btn.classList.add('selected-incorrect');
        fb.innerHTML = '&#10007; ' + opt.m;
        fb.className = 'feedback show incorrect';
      }
    });
    optWrap.appendChild(btn);
  });
  container.appendChild(optWrap);
  container.appendChild(fb);
}

function renderTypein(qKey, q, container){
  const row = document.createElement('div');
  row.className = 'typein-row';
  const input = document.createElement('input');
  input.type = 'number';
  input.setAttribute('aria-label', 'Answer');
  input.setAttribute('step', 'any');
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'Check';
  const fb = document.createElement('div');
  fb.className = 'feedback';
  btn.addEventListener('click', ()=>{
    const val = parseFloat(input.value);
    if(!isNaN(val) && Math.abs(val - q.answer) <= q.tol){
      fb.innerHTML = '&#10003; ' + q.correctMsg;
      fb.className = 'feedback show correct';
      input.disabled = true;
      btn.disabled = true;
    } else {
      fb.innerHTML = '&#10007; ' + q.wrongMsg;
      fb.className = 'feedback show incorrect';
    }
  });
  row.appendChild(input);
  row.appendChild(btn);
  container.appendChild(row);
  container.appendChild(fb);
}

function renderTable(table){
  const t = document.createElement('table');
  t.className = 'q-table';
  const headRow = document.createElement('tr');
  table.headers.forEach(h=>{ const th = document.createElement('th'); th.textContent = h; headRow.appendChild(th); });
  t.appendChild(headRow);
  const dataRow = document.createElement('tr');
  table.row.forEach(v=>{ const td = document.createElement('td'); td.textContent = v; dataRow.appendChild(td); });
  t.appendChild(dataRow);
  return t;
}

function renderQuestion(pageNum, tier, q, index){
  const qKey = `p${pageNum}-${tier}-${index}`;
  const card = document.createElement('div');
  card.className = 'q-card';

  if(q.type === 'ed'){
    const lbl = document.createElement('span');
    lbl.className = 'ed-label';
    lbl.textContent = 'Error Detective';
    card.appendChild(lbl);
  }

  if(q.dg){
    const dRow = document.createElement('div');
    dRow.className = 'diagram-row';
    dRow.innerHTML = renderDiagram(q.dg);
    card.appendChild(dRow);
  }

  const prompt = document.createElement('p');
  prompt.className = 'q-prompt';
  prompt.innerHTML = `<span class="q-num">${index+1}.</span>` + q.prompt;
  card.appendChild(prompt);

  if(q.type === 'table_mc'){
    card.appendChild(renderTable(q.table));
  }

  if(q.type === 'mc' || q.type === 'ed' || q.type === 'table_mc'){
    renderOptions(qKey, q, card, q.type==='ed');
  } else if(q.type === 'typein'){
    renderTypein(qKey, q, card);
  }

  return card;
}

// ---------- Build notebook ----------
const notebook = document.getElementById('notebook');

function buildPage(pageNum){
  const meta = PAGE_META[pageNum];
  const panel = document.createElement('section');
  panel.className = 'page-panel';
  panel.id = `page-${pageNum}`;

  const spread = document.createElement('div');
  spread.className = 'spread';
  const spiral = document.createElement('div');
  spiral.className = 'spiral';
  const paper = document.createElement('div');
  paper.className = 'paper';

  const title = document.createElement('h2');
  title.className = 'page-title';
  title.innerHTML = meta.title;
  paper.appendChild(title);

  const sub = document.createElement('p');
  sub.className = 'page-sub';
  sub.textContent = 'Choose a tier below. One or two questions revisit an earlier skill \u2014 keep an eye out.';
  paper.appendChild(sub);

  const tierNav = document.createElement('div');
  tierNav.className = 'tier-nav';
  ['foundation','core','extension'].forEach((tier, i)=>{
    const btn = document.createElement('button');
    btn.className = 'tier-btn' + (i===0 ? ' active' : '');
    btn.textContent = TIER_LABEL[tier];
    btn.style.setProperty('--_c', meta.color);
    if(i===0){ btn.style.background = meta.color; btn.style.borderColor = meta.color; }
    btn.addEventListener('click', ()=>{
      paper.querySelectorAll('.tier-btn').forEach(b=>{ b.classList.remove('active'); b.style.background=''; b.style.borderColor=''; b.style.color=''; });
      paper.querySelectorAll('.tier-panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      btn.style.background = meta.color; btn.style.borderColor = meta.color; btn.style.color = '#fff';
      document.getElementById(`tier-${pageNum}-${tier}`).classList.add('active');
    });
    tierNav.appendChild(btn);
  });
  paper.appendChild(tierNav);

  ['foundation','core','extension'].forEach((tier, i)=>{
    const tierPanel = document.createElement('div');
    tierPanel.className = 'tier-panel' + (i===0 ? ' active' : '');
    tierPanel.id = `tier-${pageNum}-${tier}`;
    BANK[pageNum][tier].forEach((q, idx)=>{
      tierPanel.appendChild(renderQuestion(pageNum, tier, q, idx));
    });
    paper.appendChild(tierPanel);
  });

  // Confidence rating
  const conf = document.createElement('div');
  conf.className = 'confidence';
  const cLabel = document.createElement('p');
  cLabel.textContent = 'How confident do you feel about this topic overall?';
  conf.appendChild(cLabel);
  const confRow = document.createElement('div');
  confRow.className = 'conf-row';
  const confNote = document.createElement('p');
  confNote.className = 'conf-note';
  confNote.textContent = 'Thanks \u2014 your response has been saved.';
  const faces = [{e:'\u{1F610}', v:'unsure'}, {e:'\u{1F642}', v:'getting-there'}, {e:'\u{1F60A}', v:'got-it'}];
  const confKey = `pro-trn-conf-p${pageNum}`;
  const savedConf = safeGet(confKey, '');
  faces.forEach(f=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'conf-btn' + (savedConf===f.v ? ' chosen' : '');
    b.textContent = f.e;
    b.setAttribute('aria-label', f.v);
    b.addEventListener('click', ()=>{
      confRow.querySelectorAll('.conf-btn').forEach(x=>x.classList.remove('chosen'));
      b.classList.add('chosen');
      safeSet(confKey, f.v);
      confNote.classList.add('show');
    });
    confRow.appendChild(b);
  });
  conf.appendChild(confRow);
  conf.appendChild(confNote);
  if(savedConf) confNote.classList.add('show');
  paper.appendChild(conf);

  spread.appendChild(spiral);
  spread.appendChild(paper);
  panel.appendChild(spread);
  return panel;
}

[1,2,3,4].forEach(n=>notebook.appendChild(buildPage(n)));

// ---------- Deep-link support: index.html can link to #page-2 etc. ----------
function activatePage(pageNum){
  document.querySelectorAll('.page-tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.page-panel').forEach(p=>p.classList.remove('active'));
  const tab = document.querySelector(`.page-tab[data-page="${pageNum}"]`);
  const panel = document.getElementById(`page-${pageNum}`);
  if(tab) tab.classList.add('active');
  if(panel) panel.classList.add('active');
}
const hashMatch = /^#page-([1-4])$/.exec(window.location.hash);
activatePage(hashMatch ? hashMatch[1] : '1');

// ---------- Page tab navigation ----------
document.querySelectorAll('.page-tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    activatePage(btn.dataset.page);
    window.scrollTo({top:0, behavior:'smooth'});
  });
});
</script>
