<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Review — Ratios & Rates — MA4-RAT-C-01</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Nunito+Sans:wght@400;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap');

:root {
  --bg:         #F4EFE9;
  --card:       #FFFFFF;
  --border:     #DDD5CA;
  --accent:     #B45309;
  --accent-dk:  #92400E;
  --accent-lt:  #FEF3C7;
  --text:       #1C1917;
  --muted:      #78716C;
  --green:      #15803D;
  --green-lt:   #DCFCE7;
  --red:        #B91C1C;
  --red-lt:     #FEE2E2;
  --blue:       #1E40AF;
  --blue-lt:    #EFF6FF;
  --radius:     12px;
  --shadow:     0 2px 8px rgba(0,0,0,.08);
  --font-body:  'Nunito', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 16px;
  line-height: 1.6;
}
body.font-nunitosans { --font-body: 'Nunito Sans', sans-serif; }
body.font-system     { --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body.font-atkinson    { --font-body: 'Atkinson Hyperlegible', sans-serif; }

/* ── Header ─────────────────────────────────────────── */
.hub-header {
  background: var(--accent);
  color: #fff;
  padding: 20px 24px 20px;
}
.back-link {
  display: inline-block;
  color: #fff;
  opacity: .9;
  text-decoration: none;
  font-weight: 700;
  font-size: .82rem;
  margin-bottom: 10px;
}
.back-link:hover { opacity: 1; text-decoration: underline; }
.hub-header .meta {
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  opacity: .85;
  margin-bottom: 4px;
}
.hub-header h1 {
  font-size: clamp(1.35rem, 4vw, 1.9rem);
  font-weight: 900;
  line-height: 1.15;
  margin-bottom: 6px;
}
.hub-header .outcome-badge {
  display: inline-block;
  margin-top: 4px;
  background: rgba(255,255,255,.2);
  border: 1.5px solid rgba(255,255,255,.4);
  border-radius: 20px;
  padding: 3px 12px;
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: .05em;
}

/* ── Font toggle ────────────────────────────────────── */
.font-toggle-row {
  background: var(--card);
  border-bottom: 1.5px solid var(--border);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.font-toggle-row span.ft-label {
  font-size: .72rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .04em;
}
.font-btn {
  font-family: inherit;
  font-size: .76rem;
  font-weight: 700;
  padding: 5px 10px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--bg);
  color: var(--muted);
  cursor: pointer;
}
.font-btn.active { background: var(--accent); border-color: var(--accent-dk); color: #fff; }

/* ── Page nav ───────────────────────────────────────── */
.page-nav {
  display: flex;
  background: var(--card);
  border-bottom: 2px solid var(--border);
  padding: 0 16px;
}
.page-btn {
  flex: 1;
  max-width: 220px;
  padding: 12px 10px;
  font-family: inherit;
  font-size: .88rem;
  font-weight: 800;
  color: var(--muted);
  background: none;
  border: none;
  border-bottom: 3px solid transparent;
  cursor: pointer;
}
.page-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── Tier switcher ──────────────────────────────────── */
.tier-nav {
  display: flex;
  gap: 8px;
  padding: 16px 16px 0;
  max-width: 760px;
  margin: 0 auto;
  flex-wrap: wrap;
}
.tier-btn {
  font-family: inherit;
  font-size: .82rem;
  font-weight: 800;
  padding: 8px 16px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--card);
  color: var(--muted);
  cursor: pointer;
}
.tier-btn.active { background: var(--accent); border-color: var(--accent-dk); color: #fff; }
.tier-desc {
  max-width: 760px;
  margin: 10px auto 0;
  padding: 0 16px;
  font-size: .82rem;
  color: var(--muted);
  font-weight: 600;
}

/* ── Main content ───────────────────────────────────── */
main {
  max-width: 760px;
  margin: 0 auto;
  padding: 20px 16px 40px;
}

/* ── MCQ ────────────────────────────────────────────── */
.mcq-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.mcq-q { font-weight: 700; margin-bottom: 12px; font-size: .96rem; }
.mcq-opts { display: flex; flex-direction: column; gap: 8px; }
.mcq-btn {
  font-family: inherit;
  text-align: left;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: .9rem;
  font-weight: 600;
  cursor: pointer;
}
.mcq-btn:hover:not(:disabled) { border-color: var(--accent); }
.mcq-btn:disabled { cursor: default; }
.mcq-btn.correct { background: var(--green-lt); border-color: var(--green); color: var(--green); }
.mcq-btn.wrong { background: var(--red-lt); border-color: var(--red); color: var(--red); }
.mcq-feedback {
  display: none;
  margin-top: 10px;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: .86rem;
  font-weight: 600;
  line-height: 1.5;
}
.mcq-feedback.show { display: block; }
.mcq-feedback.correct { background: var(--green-lt); color: var(--green); }
.mcq-feedback.wrong { background: var(--red-lt); color: var(--red); }

/* ── Fractions ──────────────────────────────────────── */
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-weight: 800; line-height: 1.05; margin: 0 2px; }
.frac .num { border-bottom: 1.5px solid currentColor; padding: 0 3px 1px; }
.frac .den { padding: 1px 3px 0; }

/* ── Type-in ────────────────────────────────────────── */
.typein-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.typein-q { font-weight: 700; margin-bottom: 4px; font-size: .96rem; }
.typein-hint { font-size: .78rem; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
.typein-row { display: flex; gap: 8px; flex-wrap: wrap; }
.typein-input {
  flex: 1;
  min-width: 140px;
  font-family: inherit;
  font-size: .92rem;
  font-weight: 700;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--bg);
  color: var(--text);
}
.typein-input:disabled { opacity: .8; }
.typein-check-btn {
  font-family: inherit;
  font-size: .85rem;
  font-weight: 800;
  padding: 10px 18px;
  border-radius: 8px;
  border: none;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
}
.typein-check-btn:disabled { background: var(--border); color: var(--muted); cursor: default; }
.typein-feedback {
  display: none;
  margin-top: 10px;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: .86rem;
  font-weight: 600;
  line-height: 1.5;
}
.typein-feedback.show { display: block; }
.typein-feedback.correct { background: var(--green-lt); color: var(--green); }
.typein-feedback.wrong { background: var(--red-lt); color: var(--red); }

/* ── Error Detective ────────────────────────────────── */
.detective-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.case-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.case-badge {
  background: var(--accent-lt);
  color: var(--accent-dk);
  font-size: .72rem;
  font-weight: 800;
  padding: 2px 10px;
  border-radius: 12px;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.det-intro { font-size: .84rem; color: var(--muted); font-weight: 600; margin-bottom: 12px; }
.worked-lines { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.w-line {
  display: flex;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--bg);
  cursor: pointer;
  font-size: .86rem;
}
.line-num { font-weight: 900; color: var(--accent); flex-shrink: 0; }
.w-line.selected { border-color: var(--accent); background: var(--accent-lt); }
.w-line.correct-error { border-color: var(--red); background: var(--red-lt); }
.w-line.not-error { border-color: var(--green); background: var(--green-lt); opacity: .7; }
.reveal-btn {
  font-family: inherit;
  font-size: .85rem;
  font-weight: 800;
  padding: 10px 18px;
  border-radius: 8px;
  border: 1.5px solid var(--accent);
  background: #fff;
  color: var(--accent);
  cursor: pointer;
}
.reveal-btn:disabled { opacity: .5; cursor: default; }
.detective-reveal { display: none; margin-top: 12px; padding: 12px 14px; border-radius: 8px; background: var(--blue-lt); font-size: .85rem; }
.detective-reveal.show { display: block; }
.detective-reveal .error-label { font-weight: 800; color: var(--red); margin-bottom: 6px; }
.detective-reveal .correct-work { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: var(--green-lt); color: var(--green); font-weight: 700; }

/* ── Confidence ─────────────────────────────────────── */
.confidence-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius);
  padding: 18px;
  margin-top: 24px;
  box-shadow: var(--shadow);
}
.confidence-card h3 { font-size: .98rem; font-weight: 800; color: var(--accent-dk); margin-bottom: 12px; }
.conf-opts { display: flex; gap: 8px; flex-wrap: wrap; }
.conf-btn {
  font-family: inherit;
  flex: 1;
  min-width: 130px;
  padding: 12px 10px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: .82rem;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
}
.conf-btn.selected { background: var(--accent); border-color: var(--accent-dk); color: #fff; }
.conf-note { margin-top: 10px; font-size: .8rem; color: var(--muted); font-weight: 600; display: none; }
.conf-note.show { display: block; }

footer { text-align: center; font-size: .75rem; color: var(--muted); padding: 20px; }

@media (max-width: 480px) {
  .typein-row { flex-direction: column; }
  .typein-check-btn { width: 100%; }
}
</style>
</head>

<div class="hub-header">
  <a class="back-link" href="index.html">← Back to Hub</a>
  <div class="meta">Stage 4 · Daily Review Notebook</div>
  <h1>Ratios &amp; Rates — Daily Review</h1>
  <div class="outcome-badge">MAO-WM-01 &nbsp;·&nbsp; MA4-RAT-C-01</div>
</div>

<div class="font-toggle-row">
  <span class="ft-label">Font:</span>
  <button class="font-btn active" data-font="nunito" onclick="setFont('nunito', this)">Nunito Sans</button>
  <button class="font-btn" data-font="system" onclick="setFont('system', this)">System</button>
  <button class="font-btn" data-font="atkinson" onclick="setFont('atkinson', this)">Atkinson Hyperlegible</button>
</div>

<nav class="page-nav">
  <button class="page-btn active" id="page-btn-1" onclick="goPage(1)">Page 1</button>
  <button class="page-btn" id="page-btn-2" onclick="goPage(2)">Page 2</button>
</nav>

<nav class="tier-nav">
  <button class="tier-btn active" data-tier="foundation" onclick="goTier('foundation', this)">🟢 Foundation</button>
  <button class="tier-btn" data-tier="core" onclick="goTier('core', this)">🔵 Core</button>
  <button class="tier-btn" data-tier="extension" onclick="goTier('extension', this)">🟣 Extension</button>
</nav>

<main>
  <div id="question-container"></div>

  <div class="confidence-card">
    <h3>🎯 How confident do you feel with ratios and rates today?</h3>
    <div class="conf-opts" id="conf-opts"></div>
    <div class="conf-note" id="conf-note">Thanks — your response has been saved.</div>
  </div>
</main>

<footer>MA4-RAT-C-01 · Daily Review Notebook · NSW Syllabus (NESA 2022)</footer>

<script>
/* ══════════════════════════════════════════════════════
   QUESTION BANK
   Sourced from ratios-chapter.html and rates-chapter.html
   ══════════════════════════════════════════════════════ */

const bank = {
  1: {
    foundation: [
      { type:'mcq', q:'A bag has 4 red marbles and 6 blue marbles. What is the ratio of red to blue marbles?',
        options:['6:4','4:6','2:3','3:2'], correct:1,
        feedback:['This is blue to red — the question asked for red to blue, so keep the order as given.','Correct! Red : Blue = 4:6, matching the order in the question.','2:3 is the simplified form, but the question just asked for the ratio, not the simplest form.','This reverses both the order and the values — check red is listed first.'] },
      { type:'mcq', q:'Simplify the ratio 16:24 to simplest form.',
        options:['8:12','4:6','2:3','1:2'], correct:2,
        feedback:['8:12 is only divided by 2 — the HCF of 16 and 24 is 8, so keep dividing.','4:6 is divided by 4, but the HCF is 8 — one more step needed: 4:6 → 2:3.','Correct! HCF(16,24) = 8. 16÷8 : 24÷8 = 2:3.','1:2 is not equivalent — check by multiplying back up: 1×8=8, not 16.'] },
      { type:'mcq', q:'Which of these is an example of a rate?',
        options:['3:5 (boys to girls)','2:3:7 (paint colours mixed)','1/2 (half a pizza)','60 km/h'], correct:3,
        feedback:['This compares two same-unit quantities (people) — that makes it a ratio, not a rate.','This is a three-part ratio comparing same-unit quantities — not a rate.','This is a fraction, showing part of a whole — not a rate.','Correct! A rate compares two different units — here, distance (km) and time (h).'] },
      { type:'mcq', q:'A tap fills 40 L in 5 minutes. What is the flow rate as a unit rate?',
        options:['8 L/min','45 L/min','200 L/min','5 L/min'], correct:0,
        feedback:['Correct! 40 L ÷ 5 min = 8 L/min.','45 comes from adding instead of dividing — a unit rate is found by division.','200 comes from multiplying 40 × 5 — that is not how a rate is found.','5 is just the time given, not the flow rate — divide the litres by the minutes.'] },
      { type:'mcq', q:'In the ratio 3:5, what does the number 5 represent?',
        options:['The whole (3 + 5)','One of the two parts','The unit rate','The simplified form'], correct:1,
        feedback:['The whole would be 3 + 5 = 8, not 5 on its own.','Correct! In a ratio, each number listed is one part — 5 is the second part.','Ratios don\u2019t have a "unit rate" — that term applies to rates, not ratios.','3:5 is already in simplest form, but that\u2019s not what the number 5 represents here.'] },
      { type:'mcq', q:'Which ratio is equivalent to 2:5?',
        options:['4:8','5:2','6:15','3:6'], correct:2,
        feedback:['4:8 simplifies to 1:2, which is not equivalent to 2:5.','5:2 reverses the order — that changes the meaning of the ratio.','Correct! 2×3 : 5×3 = 6:15, so 6:15 is equivalent to 2:5.','3:6 simplifies to 1:2, which is not equivalent to 2:5.'] },
      { type:'mcq', q:'Which unit is correct for a rate comparing distance (km) and time (h)?',
        options:['km','h','km\u00b7h','km/h'], correct:3,
        feedback:['km alone is only the distance unit — a rate needs both units combined.','h alone is only the time unit — a rate needs both units combined.','Multiplying units (km\u00b7h) is not how a rate is written.','Correct! A rate divides one quantity by another, so the units divide too: km/h.'] },
      { type:'mcq', q:'When comparing product prices to find the best buy, what should you calculate for each option?',
        options:['The price per unit','The total price only','The total weight only','The number of items only'], correct:0,
        feedback:['Correct! Price per unit (price ÷ quantity) lets you compare fairly, regardless of pack size.','Total price alone is misleading — bigger packs usually cost more in total, even at better value.','Total weight alone tells you nothing about cost — you need price and quantity together.','The number of items doesn\u2019t account for price or size differences between products.'] }
    ],
    core: [
      { type:'mcq', q:'Divide $150 in the ratio 2:3. What is the larger share?',
        options:['$60','$90','$100','$50'], correct:1,
        feedback:['$60 is the smaller share (2 parts) — check which part is larger in the ratio.','Correct! Total parts = 5, 1 part = $30, larger share (3 parts) = $90.','$100 is too high — recheck the value of one part: $150 ÷ 5 = $30.','$50 is close to one part\u2019s value but not the full larger share.'] },
      { type:'mcq', q:'Convert 54 km/h to m/s.',
        options:['194.4 m/s','5.4 m/s','15 m/s','18 m/s'], correct:2,
        feedback:['194.4 comes from multiplying by 3.6 instead of dividing — going to m/s means dividing.','5.4 divides by the wrong factor — divide by 3.6, not 10.','Correct! 54 ÷ 3.6 = 15 m/s.','18 is close but not exact — check the division: 54 ÷ 3.6 = 15, not 18.'] },
      { type:'mcq', q:'Rice: 2 kg for $6.00, or 5 kg for $14.50. Which is better value per kg?',
        options:['2 kg for $6.00','They are equal value','Cannot be determined','5 kg for $14.50'], correct:3,
        feedback:['2 kg costs $3.00/kg, which is more expensive per kg than the 5 kg option.','They are not equal — $3.00/kg vs $2.90/kg are different.','Both prices and quantities are given, so this can be determined — divide price by quantity.','Correct! $6.00 ÷ 2 = $3.00/kg vs $14.50 ÷ 5 = $2.90/kg — the 5 kg bag is cheaper per kg.'] },
      { type:'mcq', q:'Cement, sand and gravel are mixed in the ratio 1:2:3. How many kg of sand are needed to make 36 kg of concrete?',
        options:['6 kg','12 kg','18 kg','24 kg'], correct:1,
        feedback:['6 kg is the value of 1 part, not the sand share (2 parts).','Correct! Total parts = 6, 1 part = 36 ÷ 6 = 6 kg, sand (2 parts) = 12 kg.','18 kg is the gravel share (3 parts), not sand.','24 kg is too high — recheck the value of one part first.'] },
      { type:'mcq', q:'In the ratio 3:7, what fraction of the whole is the first part?',
        options:['<span class="frac"><span class="num">3</span><span class="den">7</span></span>','<span class="frac"><span class="num">7</span><span class="den">10</span></span>','<span class="frac"><span class="num">3</span><span class="den">10</span></span>','<span class="frac"><span class="num">7</span><span class="den">3</span></span>'], correct:2,
        feedback:['3/7 compares part to part, not part to the whole — the whole is 3+7=10.','7/10 is the second part\u2019s fraction of the whole, not the first.','Correct! Whole = 3+7 = 10, so the first part is 3/10 of the whole.','7/3 compares the wrong parts and isn\u2019t a part-to-whole fraction at all.'] },
      { type:'mcq', q:'A plumber charges $85 per hour. What is the cost for a 3.5-hour job?',
        options:['$255','$280','$340','$297.50'], correct:3,
        feedback:['$255 comes from 85 × 3, missing the extra half hour.','$280 doesn\u2019t match either 85×3 or 85×3.5 — recheck the multiplication.','$340 is too high — that would be closer to 4 hours of work.','Correct! $85 × 3.5 = $297.50.'] }
    ],
    typein: [
      { q:'Simplify the ratio 45:60 to simplest form.', hint:'Enter your answer as two numbers separated by a colon (e.g. 2:3).',
        checkType:'ratio', a:3, b:4,
        correctMsg:'Correct! HCF(45,60) = 15. 45÷15 : 60÷15 = 3:4.',
        wrongMsg:'Not quite. Find the HCF of 45 and 60 first (it\u2019s 15), then divide both parts by it.' },
      { q:'A car travels 210 km in 3 hours. What is its speed as a unit rate?', hint:'Enter your answer with units (e.g. 70 km/h).',
        checkType:'number_unit', num:70, unit:'km/h', tolerance:0.1,
        correctMsg:'Correct! 210 km ÷ 3 h = 70 km/h.',
        wrongMsg:'Not quite. Divide the distance by the time, and don\u2019t forget the units: km/h.' },
      { q:'Divide $200 in the ratio 3:5. What is the smaller share, in dollars?', hint:'Enter a number only.',
        checkType:'number', num:75, tolerance:0.01,
        correctMsg:'Correct! Total parts = 8, 1 part = $25, smaller share (3 parts) = $75.',
        wrongMsg:'Not quite. Find the total parts (8), then the value of 1 part ($200 ÷ 8), then multiply by 3.' }
    ],
    extension: [
      { type:'mcq', q:'Paint mix X uses blue and white in the ratio 2:3. Paint mix Y uses blue and white in the ratio 3:5. Which mix has a higher proportion of blue paint?',
        options:['Mix Y','Mix X','They are equal','Cannot be determined'], correct:1,
        feedback:['Mix Y\u2019s blue fraction is 3/8 = 0.375, which is lower than Mix X\u2019s.','Correct! Mix X: blue = 2/5 = 0.4. Mix Y: blue = 3/8 = 0.375. Since 0.4 > 0.375, Mix X has more blue.','They are not equal — 0.4 and 0.375 are different proportions.','There is enough information — find each mix\u2019s blue fraction (part ÷ whole) and compare.'] },
        // extension mcq 2
      { type:'mcq', q:'The ratio of red to green marbles in a jar is 4:3. If 8 more red marbles are added, the ratio becomes 2:1. How many green marbles are in the jar?',
        options:['8','9','12','16'], correct:2,
        feedback:['8 doesn\u2019t satisfy the new ratio — check by substituting back into (4k+8):3k = 2:1.','9 doesn\u2019t divide evenly by 3 as a multiple of k — recheck your equation.','Correct! Let red = 4k, green = 3k. (4k+8)/3k = 2/1 → 4k+8 = 6k → k=4. Green = 3×4 = 12.','16 is too high — recheck by solving 4k+8 = 6k for k first.'] },

let currentPage = 1;

/* ══════════════════════════════════════════════════════
   PERSISTENCE HELPERS
   ══════════════════════════════════════════════════════ */
function storeKey(page, tier, qId) { return `rat-drn-p${page}-s${tier}-q${qId}`; }

function saveAnswer(page, tier, qId, data) {
  try { localStorage.setItem(storeKey(page, tier, qId), JSON.stringify(data)); } catch (e) {}
}
function loadAnswer(page, tier, qId) {
  try {
    const raw = localStorage.getItem(storeKey(page, tier, qId));
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveLastView() {
  try { localStorage.setItem('rat-drn-lastview', JSON.stringify({ page: currentPage, tier: currentTier })); } catch (e) {}
}
function loadLastView() {
  try {
    const raw = localStorage.getItem('rat-drn-lastview');
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

   FONT TOGGLE
   ══════════════════════════════════════════════════════ */
function setFont(key, btn) {
  document.body.classList.remove('font-nunito', 'font-nunitosans', 'font-system', 'font-atkinson');
  const map = { nunito: 'font-nunito', system: 'font-system', atkinson: 'font-atkinson' };
  document.body.classList.add(map[key] || 'font-nunitosans');
  document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  try { localStorage.setItem('rat-drn-font', key); } catch (e) {}
}

   PAGE / TIER NAVIGATION
   ══════════════════════════════════════════════════════ */
function goPage(page) {
  currentPage = page;
  document.querySelectorAll('.page-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-btn-' + page).classList.add('active');
  renderConfidence();
  renderTier();
  saveLastView();
}
function goTier(tier, btn) {
  currentTier = tier;
  document.querySelectorAll('.tier-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTier();
  saveLastView();
}

/* ══════════════════════════════════════════════════════
   RENDER: QUESTIONS
   ══════════════════════════════════════════════════════ */
function renderTier() {
  document.getElementById('tier-desc').textContent = tierMeta[currentTier].desc;
  const container = document.getElementById('question-container');
  container.innerHTML = '';
  const pageData = bank[currentPage];

  let qNum = 0;

  if (currentTier === 'foundation') {
    pageData.foundation.forEach(item => { qNum++; container.appendChild(buildMcq(item, currentPage, 'foundation', qNum)); });
  }

  if (currentTier === 'core') {
    pageData.core.forEach(item => { qNum++; container.appendChild(buildMcq(item, currentPage, 'core', qNum)); });
    pageData.typein.forEach(item => { qNum++; container.appendChild(buildTypein(item, currentPage, 'core', qNum)); });
  }

  if (currentTier === 'extension') {
    pageData.extension.forEach(item => { qNum++; container.appendChild(buildMcq(item, currentPage, 'extension', qNum)); });
    pageData.extTypein.forEach(item => { qNum++; container.appendChild(buildTypein(item, currentPage, 'extension', qNum)); });
    qNum++;
    container.appendChild(buildErrorDetective(pageData.errordet, currentPage, 'extension', qNum));
  }
}

function buildMcq(item, page, tier, qNum) {
  const card = document.createElement('div');
  card.className = 'mcq-card';

  const qDiv = document.createElement('div');
  qDiv.className = 'mcq-q';
  qDiv.textContent = 'Q' + qNum + '. ' + item.q;
  card.appendChild(qDiv);

  const opts = document.createElement('div');
  opts.className = 'mcq-opts';

  const fb = document.createElement('div');
  fb.className = 'mcq-feedback';

  const saved = loadAnswer(page, tier, qNum);
  const letters = ['A', 'B', 'C', 'D'];

  const buttons = item.options.map((optHtml, idx) => {
    const btn = document.createElement('button');
    btn.className = 'mcq-btn';
    btn.innerHTML = letters[idx] + ') ' + optHtml;
    btn.addEventListener('click', () => {
      if (card.querySelector('.correct, .wrong')) return;
      const isCorrect = idx === item.correct;
      btn.classList.add(isCorrect ? 'correct' : 'wrong');
      fb.className = 'mcq-feedback show ' + (isCorrect ? 'correct' : 'wrong');
      fb.textContent = (isCorrect ? '\u2705 ' : '\u274c ') + item.feedback[idx];
      buttons.forEach(b => b.disabled = true);
      saveAnswer(page, tier, qNum, { selected: idx, correct: isCorrect });
    });
    opts.appendChild(btn);
    return btn;
  });

  card.appendChild(opts);
  card.appendChild(fb);

  if (saved) {
    const isCorrect = saved.correct;
    buttons[saved.selected].classList.add(isCorrect ? 'correct' : 'wrong');
    fb.className = 'mcq-feedback show ' + (isCorrect ? 'correct' : 'wrong');
    fb.textContent = (isCorrect ? '\u2705 ' : '\u274c ') + item.feedback[saved.selected];
    buttons.forEach(b => b.disabled = true);
  }

  return card;
}

function checkTypeinValue(item, raw) {
  const val = raw.trim();
  if (val === '') return false;

  if (item.checkType === 'ratio') {
    const cleaned = val.replace(/\s+/g, '');
    const parts = cleaned.split(':');
    if (parts.length !== 2) return false;
    const a = parseFloat(parts[0]);
    const b = parseFloat(parts[1]);
    return a === item.a && b === item.b;
  }

  if (item.checkType === 'number') {
    const n = parseFloat(val.replace(/[^0-9.\-]/g, ''));
    if (isNaN(n)) return false;
    return Math.abs(n - item.num) <= item.tolerance;
  }

  if (item.checkType === 'number_unit') {
    const match = val.match(/-?[0-9]*\.?[0-9]+/);
    if (!match) return false;
    const n = parseFloat(match[0]);
    const unitPart = val.replace(match[0], '').trim().toLowerCase().replace(/\s+/g, '');
    const expectedUnit = item.unit.toLowerCase().replace(/\s+/g, '');
    if (isNaN(n)) return false;
    if (Math.abs(n - item.num) > item.tolerance) return false;
    return unitPart === expectedUnit;
  }

  return false;
}

function buildTypein(item, page, tier, qNum) {
  const card = document.createElement('div');
  card.className = 'typein-card';

  const qDiv = document.createElement('div');
  qDiv.className = 'typein-q';
  qDiv.textContent = 'Q' + qNum + '. ' + item.q;
  card.appendChild(qDiv);

  const hint = document.createElement('div');
  hint.className = 'typein-hint';
  hint.textContent = item.hint;
  card.appendChild(hint);

  const row = document.createElement('div');
  row.className = 'typein-row';

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'typein-input';
  input.placeholder = 'Your answer';

  const checkBtn = document.createElement('button');
  checkBtn.className = 'typein-check-btn';
  checkBtn.textContent = 'Check';

  const fb = document.createElement('div');
  fb.className = 'typein-feedback';

  function lockAndShow(isCorrect, valueDisplay) {
    input.disabled = true;
    checkBtn.disabled = true;
    fb.className = 'typein-feedback show ' + (isCorrect ? 'correct' : 'wrong');
    fb.textContent = (isCorrect ? '\u2705 ' : '\u274c ') + (isCorrect ? item.correctMsg : item.wrongMsg);
  }

  checkBtn.addEventListener('click', () => {
    if (checkBtn.disabled) return;
    const isCorrect = checkTypeinValue(item, input.value);
    lockAndShow(isCorrect, input.value);
    saveAnswer(page, tier, qNum, { value: input.value, correct: isCorrect });
  });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkBtn.click(); });

  row.appendChild(input);
  row.appendChild(checkBtn);
  card.appendChild(row);
  card.appendChild(fb);

  const saved = loadAnswer(page, tier, qNum);
  if (saved) {
    input.value = saved.value;
    lockAndShow(saved.correct, saved.value);
  }

  return card;
}

function buildErrorDetective(det, page, tier, qNum) {
  const card = document.createElement('div');
  card.className = 'detective-card';

  const header = document.createElement('div');
  header.className = 'case-header';
  const badge = document.createElement('span');
  badge.className = 'case-badge';
  badge.textContent = det.caseLabel;
  const titleEl = document.createElement('strong');
  titleEl.textContent = 'Q' + qNum + '. ' + det.title;
  header.appendChild(badge);
  header.appendChild(titleEl);
  card.appendChild(header);

  const intro = document.createElement('div');
  intro.className = 'det-intro';
  intro.innerHTML = 'This worked solution contains exactly one error.<br>Click the line you think is wrong, then reveal the answer to check.';
  card.appendChild(intro);

  const linesWrap = document.createElement('div');
  linesWrap.className = 'worked-lines';

  const saved = loadAnswer(page, tier, qNum);
  let selectedLine = saved ? saved.selectedLine : null;
  let revealed = saved ? saved.revealed : false;

  const lineEls = det.lines.map((lineObj, idx) => {
    const lineNum = idx + 1;
    const lEl = document.createElement('div');
    lEl.className = 'w-line';
    const numSpan = document.createElement('span');
    numSpan.className = 'line-num';
    numSpan.textContent = 'L' + lineNum;
    const contentSpan = document.createElement('span');
    contentSpan.innerHTML = lineObj.text;
    lEl.appendChild(numSpan);
    lEl.appendChild(contentSpan);

    if (!revealed) {
      lEl.addEventListener('click', () => {
        if (selectedLine !== null) return;
        selectedLine = lineNum;
        lEl.classList.add('selected');
      });
    }
    linesWrap.appendChild(lEl);
    return lEl;
  });
  card.appendChild(linesWrap);

  const revealBtn = document.createElement('button');
  revealBtn.className = 'reveal-btn';
  revealBtn.textContent = 'Reveal answer';

  const revealBox = document.createElement('div');
  revealBox.className = 'detective-reveal';
  revealBox.innerHTML =
    '<div class="error-label">Error found on Line ' + det.errorLine + '</div>' +
    '<p>' + det.explanation + '</p>' +
    '<div class="correct-work">\u2705 Correct working: ' + det.correctWorking + '</div>';

  function doReveal() {
    revealBox.classList.add('show');
    revealBtn.disabled = true;
    lineEls.forEach((lEl, idx) => {
      lEl.classList.remove('selected');
      if (idx + 1 === det.errorLine) lEl.classList.add('correct-error');
      else lEl.classList.add('not-error');
    });
    saveAnswer(page, tier, qNum, { selectedLine: selectedLine, revealed: true });
  }

  revealBtn.addEventListener('click', doReveal);
  card.appendChild(revealBtn);
  card.appendChild(revealBox);

  if (revealed) doReveal();

  return card;
}

/* ══════════════════════════════════════════════════════
   CONFIDENCE RATING
   ══════════════════════════════════════════════════════ */
const confOptions = [
  { key: 'low', label: '😟 Not confident yet' },
  { key: 'mid', label: '🙂 Getting there' },
  { key: 'good', label: '😄 Confident' },
  { key: 'high', label: '🌟 Very confident' }
];

function renderConfidence() {
  const wrap = document.getElementById('conf-opts');
  wrap.innerHTML = '';
  const note = document.getElementById('conf-note');
  note.classList.remove('show');

  let saved = null;
  try { saved = localStorage.getItem('rat-drn-conf-p' + currentPage); } catch (e) {}

  confOptions.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'conf-btn' + (saved === opt.key ? ' selected' : '');
    btn.textContent = opt.label;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.conf-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      try { localStorage.setItem('rat-drn-conf-p' + currentPage, opt.key); } catch (e) {}
      note.classList.add('show');
    });
    wrap.appendChild(btn);
  });

  if (saved) note.classList.add('show');
}

/* ══════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════ */
(function init() {
  let savedFont = null;
  try { savedFont = localStorage.getItem('rat-drn-font'); } catch (e) {}
  if (savedFont) {
    const btn = document.querySelector('.font-btn[data-font="' + savedFont + '"]');
    if (btn) setFont(savedFont, btn);
  }

  const lastView = loadLastView();
  if (lastView && lastView.page && bank[lastView.page]) {
    currentPage = lastView.page;
    currentTier = lastView.tier || 'foundation';
    document.querySelectorAll('.page-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('page-btn-' + currentPage).classList.add('active');
    document.querySelectorAll('.tier-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tier === currentTier);
    });
  }

  renderConfidence();
  renderTier();
})();
</script>
